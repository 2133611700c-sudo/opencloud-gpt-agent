name: Bland Signup Probe

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - 'scripts/bland-signup-probe.mjs'
      - '.github/workflows/bland-signup-probe.yml'
      - 'ops/agent-control/triggers/bland-signup-probe.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium
      - name: Probe Bland signup
        run: node scripts/bland-signup-probe.mjs
      - name: Commit probe result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ops/agent-control/reports/bland-signup-probe.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ops/agent-control/reports/bland-signup-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: capture Bland signup probe'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
