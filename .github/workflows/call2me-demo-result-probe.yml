name: Call2Me Demo Result Probe

# One-shot read-only probe for historical demo result retrieval.
on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-demo-result-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: https://api.call2me.app/v1
      CALL_ID: demo_177cf10bd989
      PAYLOAD_API: https://api.github.com/repos/2133611700c-sudo/opencloud-gpt-agent/contents/ops/agent-control/call2me-demo-result-probe/payload.b64?ref=feat%2Fopenclaw-vendor-phone-calls
    steps:
      - name: Generate one-time inbound key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem

      - name: Upload one-time public key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-demo-result-probe-key-${{ github.run_id }}
          path: /tmp/public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted API key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 90); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/payload.b64 -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
              "${PAYLOAD_API}&nonce=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = "200" ]; then found=true; break; fi
            sleep 4
          done
          [ "$found" = true ] || exit 20
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/payload.enc -out /tmp/api-key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          KEY="$(cat /tmp/api-key)"
          test -n "$KEY"
          echo "::add-mask::$KEY"
          rm -f /tmp/payload.b64 /tmp/payload.enc

      - name: Probe old demo result read-only
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat /tmp/api-key)"
          echo "::add-mask::$KEY"
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/raw.json -w '%{http_code}' \
            "$API/calls/$CALL_ID" -H "Authorization: Bearer $KEY")"
          echo "demo_result_http=$CODE"
          jq -n --arg code "$CODE" --arg id "$CALL_ID" --argjson raw "$(cat /tmp/raw.json 2>/dev/null || echo '{}')" \
            '{call_id:$id,http_code:($code|tonumber),status:($raw.call_status // $raw.status // null),duration_ms:($raw.duration_ms // null),transcript_available:(($raw.transcript // $raw.transcript_object // null)!=null),summary_available:(($raw.call_analysis.summary // $raw.call_analysis.call_summary // $raw.summary // null)!=null),recording_available:(($raw.recording_url // null)!=null),detail:($raw.detail // $raw.message // null)}' \
            > /tmp/result.json
          cat /tmp/result.json
          rm -f /tmp/api-key /tmp/private.pem /tmp/raw.json

      - name: Upload sanitized result
        uses: actions/upload-artifact@v5
        with:
          name: call2me-demo-result-probe-${{ github.run_id }}
          path: /tmp/result.json
          retention-days: 1
          if-no-files-found: error
