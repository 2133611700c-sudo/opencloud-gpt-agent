name: Call2Me Finalize Login

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-finalize-login.yml']

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API: https://api.call2me.app/v1
      EMAIL: 2133611700c@gmail.com
      AGENT_ID: agent_f2949915a3f2
      PAYLOAD_API: https://api.github.com/repos/2133611700c-sudo/opencloud-gpt-agent/contents/ops/agent-control/call2me-secure-login/payload.b64?ref=feat%2Fopenclaw-vendor-phone-calls
    steps:
      - name: Generate one-time inbound key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/inbound-private.pem 2>/dev/null
          openssl pkey -in /tmp/inbound-private.pem -pubout -out /tmp/inbound-public.pem
          echo 'inbound_key_ready=true'

      - name: Upload inbound public key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-finalize-inbound-key-${{ github.run_id }}
          path: /tmp/inbound-public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted password
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          found=false
          for attempt in $(seq 1 120); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/payload.b64 -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
              "${PAYLOAD_API}&nonce=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = "200" ]; then found=true; break; fi
            sleep 5
          done
          if [ "$found" != "true" ]; then echo 'encrypted password not supplied' >&2; exit 20; fi
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/inbound-private.pem -in /tmp/payload.enc -out /tmp/payload.json \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          PASSWORD="$(jq -r '.password // empty' /tmp/payload.json)"
          if [ "${#PASSWORD}" -lt 8 ]; then echo 'invalid encrypted password payload' >&2; exit 21; fi
          echo "::add-mask::$PASSWORD"
          printf '%s' "$PASSWORD" > /tmp/call2me.password
          rm -f /tmp/payload.json /tmp/payload.enc /tmp/payload.b64
          echo 'encrypted_password_decrypted=true'

      - name: Login with existing password
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(cat /tmp/call2me.password)"
          echo "::add-mask::$PASSWORD"
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/login.json -w '%{http_code}' \
            -X POST "$API/auth/login" -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')")"
          echo "login_http=$CODE"
          if [[ ! "$CODE" =~ ^2 ]]; then exit 30; fi
          ACCESS="$(jq -r '.access_token // .data.access_token // empty' /tmp/login.json)"
          test -n "$ACCESS"
          echo "::add-mask::$ACCESS"
          printf '%s' "$ACCESS" > /tmp/access.token
          rm -f /tmp/login.json

      - name: Configure universal outbound agent
        shell: bash
        run: |
          set -euo pipefail
          ACCESS="$(cat /tmp/access.token)"
          echo "::add-mask::$ACCESS"
          SYSTEM_PROMPT=$(cat <<'PROMPT'
          You are Sergii's authorized outbound AI phone assistant. Every call is outbound and has runtime context: language, caller_name, on_behalf_of, objective, caller_context, questions, and success_condition.

          FIRST TURN: immediately identify yourself as an AI phone assistant calling on behalf of Sergii and state the concrete purpose of the call from the runtime objective. Never open with "Can I help you?" or "How can I help you?".

          Speak in the requested language. Ask one question at a time. Listen to the real answer before the next question. Treat runtime questions as a checklist, not a rigid script. Use caller_context only as background. Never invent missing facts. Confirm ambiguous names, dates, prices, model/part numbers, addresses, spelling, policies, or other critical details.

          Stop when success_condition is met or the person cannot provide the requested information. You may exchange factual information but must not purchase, pay, reserve, authorize work, accept contractual/legal terms, or make commitments. Never request passwords, card data, SSNs, or unnecessary sensitive information. If asked for Sergii directly, say you can relay a callback request.

          If voicemail is detected, hang up without leaving a message. At the end, briefly confirm the key factual result, thank the person, and end the call.
          PROMPT
          )
          BODY="$(jq -cn --arg prompt "$SYSTEM_PROMPT" '{begin_message_mode:"dynamic",max_call_duration_ms:300000,enable_recording:false,voicemail_detection_enabled:true,voicemail_action:"hangup",responsiveness:0.7,interruption_sensitivity:0.7,enable_backchannel:true,response_engine:{type:"call2me-llm",system_prompt:$prompt,llm_provider:"openrouter",llm_model:"gpt-4o-mini",temperature:0.2,builtin_functions:["end_call"]},metadata:{owner:"Sergii",purpose:"universal_outbound_phone_agent",mode:"production"}}')"
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/agent.json -w '%{http_code}' \
            -X PATCH "$API/agents/$AGENT_ID" -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS" --data "$BODY")"
          echo "agent_patch_http=$CODE"
          if [[ ! "$CODE" =~ ^2 ]]; then jq -r '.detail // .message // "agent patch failed"' /tmp/agent.json || true; exit 40; fi
          MODE="$(jq -r '.begin_message_mode // empty' /tmp/agent.json)"
          echo "agent_begin_message_mode=${MODE:-unknown}"
          [ "$MODE" = "dynamic" ]

      - name: Create dedicated OpenClaw API key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ACCESS="$(cat /tmp/access.token)"
          echo "::add-mask::$ACCESS"
          CODE="$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/keys.json -w '%{http_code}' "$API/api-keys" -H "Authorization: Bearer $ACCESS")"
          echo "api_key_list_http=$CODE"
          if [[ ! "$CODE" =~ ^2 ]]; then exit 50; fi
          while IFS= read -r KEY_ID; do
            [ -n "$KEY_ID" ] || continue
            RC="$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/revoke.json -w '%{http_code}' -X DELETE "$API/api-keys/$KEY_ID" -H "Authorization: Bearer $ACCESS")"
            echo "previous_openclaw_key_revoked_http=$RC"
            if [[ ! "$RC" =~ ^2 ]]; then exit 51; fi
          done < <(jq -r '.[] | select(.name=="OpenClaw Phone Agent" and .is_active==true) | .key_id' /tmp/keys.json)
          BODY='{"name":"OpenClaw Phone Agent","permissions":[],"rate_limit":120,"read_only":false,"expires_in_days":180}'
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/key.json -w '%{http_code}' -X POST "$API/api-keys" -H 'Content-Type: application/json' -H "Authorization: Bearer $ACCESS" --data "$BODY")"
          echo "api_key_create_http=$CODE"
          if [ "$CODE" != "201" ]; then jq -r '.detail // .message // "api key create failed"' /tmp/key.json || true; exit 52; fi
          API_KEY="$(jq -r '.api_key // empty' /tmp/key.json)"
          KEY_ID="$(jq -r '.key_id // empty' /tmp/key.json)"
          KEY_PREFIX="$(jq -r '.key_prefix // empty' /tmp/key.json)"
          test -n "$API_KEY" -a -n "$KEY_ID"
          echo "::add-mask::$API_KEY"
          printf '%s' "$API_KEY" > /tmp/api-key.secret
          echo "created_api_key_id=$KEY_ID"
          echo "created_api_key_prefix=$KEY_PREFIX"
          cat > /tmp/return-public.pem <<'PUBKEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApn/VxyQGFAve07ZVOAHH
          URTKxFKup39T7pFJMh4oHGqoLsELnjLVh7P0cPsdGjpSQ25vs0Zxf/jMWUBEPPvz
          ZvKFwEZ3lzyUMyk58QGztni1vtsQt7yqIAc1IsQh5XqW6HRATzt4GnhsPja+JvSs
          kaiSWFbEIxPHuo90qt7GOSZ9TrL7I96xJJ/TiCD+7pZkYh9CUTQPT3ZTYtqYO4wn
          lo/Ymnus2h1wyN07VQ7fr5s2YgKVHF5Z/NHgb4UwEcA3feASxjFTlQVln8iTxx37
          SN6XlGzllX+mWppJ04uvsWHUd3Gwmym3/hLsc58ChYCI9L9APBQJfEmHrIQ9Ga7u
          kQSACtz5AdbI3/g8ARdt9dF9pLHk5Y283NrY3HfR7TkbIdhEksyirAGjEQZ1DPi2
          JyGkWBAsrqTDGCnBT2ay44DdwmcUzEMShxCQnJ3msS9g3riI1+erv+9Xfeq4CE1R
          eomNqqv0mF40yvggP82FGEwNXZiHGfC3AW+pJrDOhpoDAgMBAAE=
          -----END PUBLIC KEY-----
          PUBKEY
          sed -i 's/^          //' /tmp/return-public.pem
          openssl pkeyutl -encrypt -pubin -inkey /tmp/return-public.pem -in /tmp/api-key.secret -out /tmp/api-key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm -f /tmp/api-key.secret /tmp/return-public.pem
          echo 'api_key_encrypted=true'

      - name: Audit wallet and caller-number readiness
        shell: bash
        run: |
          set -euo pipefail
          ACCESS="$(cat /tmp/access.token)"
          echo "::add-mask::$ACCESS"
          BC="$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/wallet.json -w '%{http_code}' "$API/wallet/balance" -H "Authorization: Bearer $ACCESS")"
          NC="$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/numbers.json -w '%{http_code}' "$API/phone-numbers" -H "Authorization: Bearer $ACCESS")"
          echo "wallet_http=$BC"
          echo "phone_numbers_http=$NC"
          if [[ ! "$BC" =~ ^2 ]]; then exit 60; fi
          if [[ ! "$NC" =~ ^2 ]]; then echo '[]' > /tmp/numbers.json; fi
          BALANCE="$(jq -r '.balance // .available_balance // 0' /tmp/wallet.json)"
          COUNT="$(jq 'if type=="array" then length elif (.items|type)=="array" then (.items|length) else 0 end' /tmp/numbers.json 2>/dev/null || echo 0)"
          KEY_ID="$(jq -r '.key_id' /tmp/key.json)"
          KEY_PREFIX="$(jq -r '.key_prefix' /tmp/key.json)"
          EXPIRES="$(jq -r '.expires_at // empty' /tmp/key.json)"
          jq -n --arg agent_id "$AGENT_ID" --arg balance "$BALANCE" --arg key_id "$KEY_ID" --arg key_prefix "$KEY_PREFIX" --arg expires "$EXPIRES" --argjson caller_number_count "$COUNT" '{provider:"Call2Me",agent_id:$agent_id,agent_begin_message_mode:"dynamic",api_key:{key_id:$key_id,key_prefix:$key_prefix,expires_at:$expires},wallet_balance:$balance,caller_number_count:$caller_number_count}' > /tmp/report.json
          cat /tmp/report.json
          rm -f /tmp/access.token /tmp/call2me.password /tmp/inbound-private.pem /tmp/key.json /tmp/keys.json /tmp/numbers.json /tmp/wallet.json

      - name: Upload encrypted API key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-openclaw-api-key-encrypted-${{ github.run_id }}
          path: /tmp/api-key.enc
          retention-days: 1
          if-no-files-found: error

      - name: Upload sanitized report
        uses: actions/upload-artifact@v5
        with:
          name: call2me-finalize-report-${{ github.run_id }}
          path: /tmp/report.json
          retention-days: 30
          if-no-files-found: error
