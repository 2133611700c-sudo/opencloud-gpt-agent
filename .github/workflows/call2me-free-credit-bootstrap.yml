name: Call2Me Free Credit Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-free-credit-bootstrap.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate, create API key and multifunction agent
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API='https://api.call2me.app/v1'
          EMAIL='2133611700c@gmail.com'

          QCODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/quick.json -w '%{http_code}' \
            -X POST "$API/auth/quick-login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg email "$EMAIL" --arg name 'Sergii' '{email:$email,full_name:$name,expires_hours:1}')")"
          echo "quick_login_http=$QCODE"
          if [[ ! "$QCODE" =~ ^2 ]]; then
            echo 'Quick login request failed.' >&2
            exit 10
          fi

          URL="$(jq -r '.url // empty' /tmp/quick.json)"
          TOKEN="$(python3 - "$URL" <<'PY'
          import sys, urllib.parse
          u=urllib.parse.urlparse(sys.argv[1])
          q=urllib.parse.parse_qs(u.query)
          print((q.get('token') or [''])[0])
          PY
          )"
          if [ -z "$TOKEN" ]; then
            echo 'Quick login token was not returned.' >&2
            exit 11
          fi

          VCODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/verify.json -w '%{http_code}' \
            -X POST "$API/auth/quick-login/verify" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg token "$TOKEN" '{token:$token}')")"
          echo "quick_login_verify_http=$VCODE"
          if [[ ! "$VCODE" =~ ^2 ]]; then
            echo 'Quick login verification failed.' >&2
            exit 12
          fi

          ACCESS="$(jq -r '.access_token // .data.access_token // .token // empty' /tmp/verify.json)"
          if [ -z "$ACCESS" ]; then
            echo 'No access token returned.' >&2
            exit 13
          fi

          BAL_CODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/balance.json -w '%{http_code}' \
            "$API/users/me/balance" -H "Authorization: Bearer $ACCESS")"
          echo "balance_http=$BAL_CODE"
          if [[ ! "$BAL_CODE" =~ ^2 ]]; then
            echo 'Balance check failed.' >&2
            exit 14
          fi

          KEY_CODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/key.json -w '%{http_code}' \
            -X POST "$API/api-keys" -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ACCESS" \
            --data '{"name":"openclaw-call2me-runtime","read_only":false,"rate_limit":1000}')"
          echo "api_key_http=$KEY_CODE"
          if [[ ! "$KEY_CODE" =~ ^2 ]]; then
            echo 'API key creation failed.' >&2
            exit 15
          fi
          API_KEY="$(jq -r '.api_key // empty' /tmp/key.json)"
          KEY_ID="$(jq -r '.key_id // empty' /tmp/key.json)"
          if [ -z "$API_KEY" ]; then
            echo 'API key value missing from response.' >&2
            exit 16
          fi

          VOICE_CODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/voices.json -w '%{http_code}' \
            "$API/voices?language=en-US" -H "Authorization: Bearer $API_KEY")"
          echo "voices_http=$VOICE_CODE"
          VOICE_ID="$(jq -r 'map(select(.voice_id=="openai-nova"))[0].voice_id // .[0].voice_id // empty' /tmp/voices.json 2>/dev/null || true)"
          if [ -z "$VOICE_ID" ]; then VOICE_ID='openai-nova'; fi
          echo "selected_voice=$VOICE_ID"

          SYSTEM_PROMPT=$(cat <<'PROMPT'
          You are Sergii's authorized multifunction outbound AI phone assistant. At the beginning of every call, clearly say that you are an AI assistant calling on behalf of Sergii. Speak concise, natural American English.

          The call supplies role, vendor_name, objective, and first_sentence in dynamic variables. Follow those runtime facts exactly.

          Supported roles:
          - vendor_inventory: verify the exact item/model/part number, whether it is physically in stock now, quantity, current price, exact pickup location, and whether Sergii can pick it up today. Ask the employee to physically verify shelf/warehouse inventory when useful. Never treat a catalog listing as physical stock.
          - service_booking: obtain factual service availability, scope, price/estimate, and earliest appointment. Do not book unless the runtime objective explicitly authorizes booking.
          - information_request: obtain the requested factual information and confirm it back.
          - follow_up: obtain the current status of a prior request/order/service and the next concrete step.

          Ask one short question at a time. Do not invent facts. Do not purchase, pay, reserve, accept terms, or make commitments unless the runtime objective explicitly authorizes that action. Recording is disabled. Before ending, briefly repeat the verified facts and ask for correction if anything is inaccurate, then thank the person and end the call.
          PROMPT
          )

          AGENT_BODY="$(jq -cn --arg v "$VOICE_ID" --arg prompt "$SYSTEM_PROMPT" '{
            agent_name:"Sergii OpenClaw MultiRole Caller",
            voice_id:$v,
            language:"en-US",
            begin_message_mode:"dynamic",
            max_call_duration_ms:300000,
            enable_recording:false,
            response_engine:{
              type:"call2me-llm",
              system_prompt:$prompt,
              llm_provider:"openrouter",
              llm_model:"gpt-4o-mini",
              temperature:0.2,
              builtin_functions:["end_call"]
            },
            metadata:{owner:"Sergii",purpose:"openclaw_outbound_calls"}
          }')"
          AGENT_CODE="$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/agent.json -w '%{http_code}' \
            -X POST "$API/agents" -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $API_KEY" --data "$AGENT_BODY")"
          echo "agent_http=$AGENT_CODE"
          if [[ ! "$AGENT_CODE" =~ ^2 ]]; then
            jq -r '{detail:(.detail // .message // "agent creation failed")}' /tmp/agent.json || true
            exit 17
          fi
          AGENT_ID="$(jq -r '.agent_id // empty' /tmp/agent.json)"
          if [ -z "$AGENT_ID" ]; then
            echo 'Agent id missing from response.' >&2
            exit 18
          fi
          echo "agent_id=$AGENT_ID"

          jq -n \
            --arg api_key "$API_KEY" \
            --arg key_id "$KEY_ID" \
            --arg agent_id "$AGENT_ID" \
            --arg voice_id "$VOICE_ID" \
            --argjson balance "$(cat /tmp/balance.json)" \
            '{api_key:$api_key,key_id:$key_id,agent_id:$agent_id,voice_id:$voice_id,balance:$balance,created_at:(now|todate)}' \
            > /tmp/call2me-runtime-credential.json

          jq -n \
            --arg key_id "$KEY_ID" \
            --arg agent_id "$AGENT_ID" \
            --arg voice_id "$VOICE_ID" \
            --argjson balance "$(cat /tmp/balance.json)" \
            '{status:"ready",key_id:$key_id,agent_id:$agent_id,voice_id:$voice_id,balance:$balance}' \
            > /tmp/call2me-bootstrap-report.json

      - name: Upload Call2Me runtime credential
        uses: actions/upload-artifact@v5
        with:
          name: call2me-runtime-credential
          path: /tmp/call2me-runtime-credential.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload sanitized bootstrap report
        uses: actions/upload-artifact@v5
        with:
          name: call2me-bootstrap-report-${{ github.run_id }}
          path: /tmp/call2me-bootstrap-report.json
          if-no-files-found: error
          retention-days: 30
