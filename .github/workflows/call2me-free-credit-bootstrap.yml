name: Call2Me Free Credit Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-free-credit-bootstrap.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      API: https://api.call2me.app/v1
      EMAIL: 2133611700c@gmail.com
      EXISTING_AGENT_ID: agent_f2949915a3f2
      PAYLOAD_API: https://api.github.com/repos/2133611700c-sudo/opencloud-gpt-agent/contents/ops/agent-control/call2me-secure-reset/payload.b64?ref=feat%2Fopenclaw-vendor-phone-calls
    steps:
      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          echo 'one_time_public_key_ready=true'

      - name: Upload one-time public key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-wallet-public-key-${{ github.run_id }}
          path: /tmp/public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted login payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          found=false
          for attempt in $(seq 1 120); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 \
              -o /tmp/payload.b64 -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              "${PAYLOAD_API}&nonce=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = "200" ]; then
              found=true
              break
            fi
            sleep 5
          done
          if [ "$found" != "true" ]; then
            echo 'Encrypted login payload was not supplied within the wait window.' >&2
            exit 20
          fi
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/private.pem \
            -in /tmp/payload.enc \
            -out /tmp/payload.json \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          PASSWORD="$(jq -r '.new_password // empty' /tmp/payload.json)"
          if [ "${#PASSWORD}" -lt 16 ]; then
            echo 'Decrypted login payload is invalid.' >&2
            exit 21
          fi
          echo "::add-mask::$PASSWORD"
          printf '%s' "$PASSWORD" > /tmp/call2me.password
          rm -f /tmp/payload.json /tmp/payload.enc /tmp/payload.b64
          echo 'encrypted_login_payload_decrypted=true'

      - name: Login to verified Call2Me account
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(cat /tmp/call2me.password)"
          echo "::add-mask::$PASSWORD"
          LOGIN_CODE="$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/login.json -w '%{http_code}' \
            -X POST "$API/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')")"
          echo "login_http=$LOGIN_CODE"
          if [[ ! "$LOGIN_CODE" =~ ^2 ]]; then exit 30; fi
          ACCESS="$(jq -r '.access_token // .data.access_token // empty' /tmp/login.json)"
          test -n "$ACCESS"
          echo "::add-mask::$ACCESS"
          printf '%s' "$ACCESS" > /tmp/access.token
          rm -f /tmp/login.json

      - name: Audit wallet and signup bonus
        shell: bash
        run: |
          set -euo pipefail
          ACCESS="$(cat /tmp/access.token)"
          echo "::add-mask::$ACCESS"

          get_json() {
            local path="$1" out="$2"
            local code
            code="$(curl -sS --connect-timeout 15 --max-time 30 -o "$out" -w '%{http_code}' \
              "$API$path" -H "Authorization: Bearer $ACCESS")"
            echo "$out http=$code"
            if [[ ! "$code" =~ ^2 ]]; then
              printf '{"http_code":%s}' "$code" > "$out"
            fi
          }

          get_json '/wallet/balance' /tmp/wallet-balance.json
          get_json '/wallet/summary' /tmp/wallet-summary.json
          get_json '/wallet/transactions?limit=20&offset=0' /tmp/wallet-transactions.json
          get_json '/wallet/pricing' /tmp/wallet-pricing.json
          get_json '/users/me/balance' /tmp/user-balance.json
          get_json "/agents/$EXISTING_AGENT_ID" /tmp/agent.json

          jq -n \
            --arg provider 'Call2Me' \
            --arg agent_id "$EXISTING_AGENT_ID" \
            --argjson wallet_balance "$(cat /tmp/wallet-balance.json)" \
            --argjson wallet_summary "$(cat /tmp/wallet-summary.json)" \
            --argjson transactions "$(cat /tmp/wallet-transactions.json)" \
            --argjson pricing "$(cat /tmp/wallet-pricing.json)" \
            --argjson user_balance "$(cat /tmp/user-balance.json)" \
            --argjson agent "$(cat /tmp/agent.json)" \
            '{provider:$provider,agent_id:$agent_id,wallet_balance:$wallet_balance,wallet_summary:$wallet_summary,transactions:$transactions,pricing:$pricing,user_balance:$user_balance,agent:{agent_id:($agent.agent_id // null),agent_name:($agent.agent_name // null),language:($agent.language // null),voice_id:($agent.voice_id // null)},verified_at:(now|todate)}' \
            > /tmp/call2me-wallet-report.json

          echo '=== wallet summary ==='
          jq '{wallet_balance, wallet_summary, pricing, user_balance, agent}' /tmp/call2me-wallet-report.json
          echo '=== transactions summary ==='
          jq '.transactions' /tmp/call2me-wallet-report.json
          rm -f /tmp/access.token /tmp/call2me.password /tmp/private.pem

      - name: Upload sanitized wallet report
        uses: actions/upload-artifact@v5
        with:
          name: call2me-wallet-report-${{ github.run_id }}
          path: /tmp/call2me-wallet-report.json
          if-no-files-found: error
          retention-days: 30
