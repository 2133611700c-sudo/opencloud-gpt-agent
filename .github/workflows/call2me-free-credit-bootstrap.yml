name: Call2Me Free Credit Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-free-credit-bootstrap.yml']

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      API: https://api.call2me.app/v1
      EMAIL: 2133611700c@gmail.com
      TEST_PHONE: '+12133611700'
      EXISTING_AGENT_ID: agent_f2949915a3f2
      PAYLOAD_API: https://api.github.com/repos/2133611700c-sudo/opencloud-gpt-agent/contents/ops/agent-control/call2me-secure-reset/payload.b64?ref=feat%2Fopenclaw-vendor-phone-calls
    steps:
      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          echo 'one_time_public_key_ready=true'

      - name: Upload one-time public key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-login-public-key-${{ github.run_id }}
          path: /tmp/public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Wait for encrypted login payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          found=false
          for attempt in $(seq 1 120); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 \
              -o /tmp/payload.b64 -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              "${PAYLOAD_API}&nonce=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = "200" ]; then
              found=true
              break
            fi
            sleep 5
          done
          if [ "$found" != "true" ]; then
            echo 'Encrypted login payload was not supplied within the wait window.' >&2
            exit 20
          fi
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/private.pem \
            -in /tmp/payload.enc \
            -out /tmp/payload.json \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          PASSWORD="$(jq -r '.new_password // empty' /tmp/payload.json)"
          if [ "${#PASSWORD}" -lt 16 ]; then
            echo 'Decrypted login payload is invalid.' >&2
            exit 21
          fi
          echo "::add-mask::$PASSWORD"
          printf '%s' "$PASSWORD" > /tmp/call2me.password
          rm -f /tmp/payload.json /tmp/payload.enc /tmp/payload.b64
          echo 'encrypted_login_payload_decrypted=true'

      - name: Login to verified Call2Me account
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PASSWORD="$(cat /tmp/call2me.password)"
          echo "::add-mask::$PASSWORD"
          LOGIN_CODE="$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/login.json -w '%{http_code}' \
            -X POST "$API/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')")"
          echo "login_http=$LOGIN_CODE"
          if [[ ! "$LOGIN_CODE" =~ ^2 ]]; then
            echo 'Call2Me login failed.' >&2
            exit 30
          fi
          ACCESS="$(jq -r '.access_token // .data.access_token // empty' /tmp/login.json)"
          if [ -z "$ACCESS" ]; then
            echo 'Login returned no access token.' >&2
            exit 31
          fi
          echo "::add-mask::$ACCESS"
          printf '%s' "$ACCESS" > /tmp/access.token
          rm -f /tmp/login.json
          echo 'call2me_login_ready=true'

      - name: Verify existing universal phone agent
        shell: bash
        run: |
          set -euo pipefail
          ACCESS="$(cat /tmp/access.token)"
          echo "::add-mask::$ACCESS"
          CODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/agent.json -w '%{http_code}' \
            "$API/agents/$EXISTING_AGENT_ID" \
            -H "Authorization: Bearer $ACCESS")"
          echo "agent_lookup_http=$CODE"
          if [[ ! "$CODE" =~ ^2 ]]; then
            echo 'Existing universal phone agent is unavailable.' >&2
            exit 40
          fi
          RETURNED_ID="$(jq -r '.agent_id // empty' /tmp/agent.json)"
          if [ "$RETURNED_ID" != "$EXISTING_AGENT_ID" ]; then
            echo 'Agent identity mismatch.' >&2
            exit 41
          fi
          printf '%s' "$RETURNED_ID" > /tmp/agent.id
          echo "agent_id=$RETURNED_ID"

      - name: Place authorized self-test call
        shell: bash
        run: |
          set -euo pipefail
          ACCESS="$(cat /tmp/access.token)"
          AGENT_ID="$(cat /tmp/agent.id)"
          echo "::add-mask::$ACCESS"
          echo "test_phone_format=$TEST_PHONE"
          BODY="$(jq -cn --arg agent "$AGENT_ID" --arg phone "$TEST_PHONE" '{
            agent_id:$agent,
            to_number:$phone,
            metadata:{test:"sergii_universal_phone_agent",requested_by:"Sergii"},
            dynamic_variables:{language:"en",objective:"Confirm two-way audio and natural conversation quality."}
          }')"
          CALL_CODE="$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/call.json -w '%{http_code}' \
            -X POST "$API/calls" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ACCESS" \
            --data "$BODY")"
          echo "call_http=$CALL_CODE"
          if [[ ! "$CALL_CODE" =~ ^2 ]]; then
            jq -r '{detail:(.detail // .message // "call request rejected")}' /tmp/call.json || true
            exit 50
          fi
          CALL_ID="$(jq -r '.call_id // empty' /tmp/call.json)"
          if [ -z "$CALL_ID" ]; then
            echo 'Call API returned no call_id.' >&2
            exit 51
          fi
          printf '%s' "$CALL_ID" > /tmp/call.id
          echo "call_id=$CALL_ID"

      - name: Poll call result
        shell: bash
        run: |
          set -euo pipefail
          ACCESS="$(cat /tmp/access.token)"
          CALL_ID="$(cat /tmp/call.id)"
          echo "::add-mask::$ACCESS"
          for attempt in $(seq 1 72); do
            CODE="$(curl -sS --connect-timeout 15 --max-time 30 \
              -o /tmp/call-result.json -w '%{http_code}' \
              "$API/calls/$CALL_ID" -H "Authorization: Bearer $ACCESS")"
            if [[ "$CODE" =~ ^2 ]]; then
              STATUS="$(jq -r '.status // .call_status // empty' /tmp/call-result.json)"
              echo "poll_status=${STATUS:-unknown}"
              case "$STATUS" in
                completed|ended|failed|no_answer|no-answer|busy|voicemail|cancelled|canceled) break ;;
              esac
            fi
            sleep 5
          done
          test -s /tmp/call-result.json
          jq '
            def scrub:
              walk(if type == "object" then with_entries(select(((.key|ascii_downcase)|test("token|password|secret|api_key|authorization"))|not)) else . end);
            scrub
          ' /tmp/call-result.json > /tmp/call-result-sanitized.json
          jq -n \
            --arg agent_id "$(cat /tmp/agent.id)" \
            --arg call_id "$(cat /tmp/call.id)" \
            --argjson provider_result "$(cat /tmp/call-result-sanitized.json)" \
            '{status:"test_finished",provider:"Call2Me",agent_id:$agent_id,call_id:$call_id,provider_result:$provider_result,verified_at:(now|todate)}' \
            > /tmp/call2me-bootstrap-report.json
          rm -f /tmp/access.token /tmp/call2me.password /tmp/private.pem

      - name: Upload sanitized bootstrap report
        uses: actions/upload-artifact@v5
        with:
          name: call2me-bootstrap-report-${{ github.run_id }}
          path: /tmp/call2me-bootstrap-report.json
          if-no-files-found: error
          retention-days: 30
