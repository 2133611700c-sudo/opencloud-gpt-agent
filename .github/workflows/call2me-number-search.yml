name: Call2Me Number Search

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-number-search.yml']

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API: https://api.call2me.app/v1
      PAYLOAD_API: https://api.github.com/repos/2133611700c-sudo/opencloud-gpt-agent/contents/ops/agent-control/call2me-number-search/payload.b64?ref=feat%2Fopenclaw-vendor-phone-calls
      DEMO_CALL_ID: demo_177cf10bd989
    steps:
      - name: Generate one-time inbound encryption key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          echo 'one_time_search_key_ready=true'

      - name: Upload one-time public key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-number-search-public-key-${{ github.run_id }}
          path: /tmp/public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted API key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          found=false
          for attempt in $(seq 1 120); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 \
              -o /tmp/payload.b64 -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github.raw+json' \
              "${PAYLOAD_API}&nonce=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = "200" ]; then found=true; break; fi
            sleep 5
          done
          if [ "$found" != "true" ]; then exit 20; fi
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/private.pem \
            -in /tmp/payload.enc \
            -out /tmp/api-key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          API_KEY="$(cat /tmp/api-key)"
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"
          echo 'encrypted_api_key_decrypted=true'
          rm -f /tmp/payload.b64 /tmp/payload.enc

      - name: Probe historical demo result read-only
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="$(cat /tmp/api-key)"
          echo "::add-mask::$API_KEY"
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/raw.json -w '%{http_code}' \
            "$API/calls/$DEMO_CALL_ID" \
            -H "Authorization: Bearer $API_KEY")"
          echo "demo_result_http=$CODE"
          jq -n \
            --arg id "$DEMO_CALL_ID" \
            --arg code "$CODE" \
            --argjson raw "$(cat /tmp/raw.json 2>/dev/null || echo '{}')" \
            '{provider:"Call2Me",call_id:$id,http_code:($code|tonumber),status:($raw.call_status // $raw.status // null),duration_ms:($raw.duration_ms // null),transcript_available:(($raw.transcript // $raw.transcript_object // null)!=null),summary_available:(($raw.call_analysis.summary // $raw.call_analysis.call_summary // $raw.summary // null)!=null),recording_available:(($raw.recording_url // null)!=null),detail:($raw.detail // $raw.message // null)}' \
            > /tmp/call2me-demo-result-probe.json
          cat /tmp/call2me-demo-result-probe.json
          rm -f /tmp/api-key /tmp/private.pem /tmp/raw.json

      - name: Upload sanitized probe result
        uses: actions/upload-artifact@v5
        with:
          name: call2me-demo-result-probe-${{ github.run_id }}
          path: /tmp/call2me-demo-result-probe.json
          retention-days: 1
          if-no-files-found: error
