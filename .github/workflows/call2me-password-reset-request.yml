name: Call2Me Password Reset Request

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - ".github/workflows/call2me-password-reset-request.yml"

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request reset email
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --connect-timeout 15 --max-time 45 \
            -o /tmp/reset.json -w '%{http_code}' \
            -X POST https://api.call2me.app/v1/auth/forgot-password \
            -H 'Content-Type: application/json' \
            --data '{"email":"2133611700c@gmail.com"}')"
          echo "HTTP=$code"
          cat /tmp/reset.json
          test "$code" -ge 200 -a "$code" -lt 300
