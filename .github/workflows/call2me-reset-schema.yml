name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Call2Me verification resend state
        shell: bash
        run: |
          set -euo pipefail
          CODE="$(curl -sS --connect-timeout 15 --max-time 30 \
            -o /tmp/resend.json -w '%{http_code}' \
            -X POST 'https://api.call2me.app/v1/auth/resend-verification' \
            -H 'Content-Type: application/json' \
            --data '{"email":"2133611700c@gmail.com"}')"
          echo "resend_verification_http=$CODE"
          jq '{message:(.message // null),detail:(.detail // null),status:(.status // null)}' /tmp/resend.json || cat /tmp/resend.json
