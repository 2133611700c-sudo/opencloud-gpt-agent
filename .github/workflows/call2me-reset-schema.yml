name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Call2Me credit and wallet schemas
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json

          echo '=== matching paths ==='
          jq -r '.paths | to_entries[] | select(.key | test("wallet|balance|credit|claim|verify-email|pricing"; "i")) | [.key, (.value|keys|join(","))] | @tsv' /tmp/openapi.json

          echo '=== endpoint details ==='
          jq '.paths | with_entries(select(.key | test("wallet|balance|credit|claim|verify-email|pricing"; "i")))' /tmp/openapi.json

          echo '=== matching component schemas ==='
          jq '.components.schemas | with_entries(select(.key | test("wallet|balance|credit|claim|verify|pricing"; "i")))' /tmp/openapi.json
