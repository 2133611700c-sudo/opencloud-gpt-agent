name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      OPENCLAW_CONTROL_SHARED_SECRET: ${{ secrets.OPENCLAW_CONTROL_SHARED_SECRET }}
      OPENCLAW_GITHUB_TOKEN: ${{ secrets.OPENCLAW_GITHUB_TOKEN }}
    steps:
      - name: Verify OpenClaw secret availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${OPENCLAW_CONTROL_SHARED_SECRET:-}" ]; then echo 'openclaw_control_shared_secret_present=true'; else echo 'openclaw_control_shared_secret_present=false'; fi
          if [ -n "${OPENCLAW_GITHUB_TOKEN:-}" ]; then echo 'openclaw_github_token_present=true'; else echo 'openclaw_github_token_present=false'; fi
