name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Call2Me call payload schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json
          echo '=== CreateCallRequest ==='
          jq '.components.schemas["call2me_core__models__call__CreateCallRequest"]' /tmp/openapi.json
          echo '=== Call response ==='
          jq '.components.schemas.Call' /tmp/openapi.json
          echo '=== phone-number paths ==='
          jq -r '.paths | to_entries[] | select(.key | test("numbers|phone-numbers"; "i")) | [.key, (.value|keys|join(","))] | @tsv' /tmp/openapi.json
