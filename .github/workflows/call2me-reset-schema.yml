name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Call2Me auth schemas
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json

          print_endpoint_and_schema() {
            local path="$1"
            echo "=== $path endpoint ==="
            jq --arg p "$path" '.paths[$p].post' /tmp/openapi.json
            ref="$(jq -r --arg p "$path" '.paths[$p].post.requestBody.content["application/json"].schema["$ref"] // empty' /tmp/openapi.json)"
            if [ -n "$ref" ]; then
              name="${ref##*/}"
              echo "=== $name schema ==="
              jq --arg n "$name" '.components.schemas[$n]' /tmp/openapi.json
            fi
          }

          print_endpoint_and_schema '/v1/auth/reset-password'
          print_endpoint_and_schema '/v1/auth/login'
          print_endpoint_and_schema '/v1/auth/quick-login'
          print_endpoint_and_schema '/v1/auth/quick-login/verify'
          print_endpoint_and_schema '/v1/api-keys'
