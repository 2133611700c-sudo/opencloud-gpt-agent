name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Call2Me API key schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json
          echo '=== api key paths ==='
          jq '.paths | with_entries(select(.key | test("api-keys"; "i")))' /tmp/openapi.json
          echo '=== api key schemas ==='
          jq '.components.schemas | with_entries(select((.key + " " + (.value|tostring)) | test("api key|api_key|apikey"; "i")))' /tmp/openapi.json
