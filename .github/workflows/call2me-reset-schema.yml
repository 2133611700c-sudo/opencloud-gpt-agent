name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Call2Me call auth scheme
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json
          echo '=== security schemes ==='
          jq '.components.securitySchemes' /tmp/openapi.json
          echo '=== calls endpoint ==='
          jq '.paths["/v1/calls"]' /tmp/openapi.json
