name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Call2Me account verification fields
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json

          echo '=== UserProfile schema ==='
          jq '.components.schemas.UserProfile' /tmp/openapi.json

          echo '=== UserStats schema ==='
          jq '.components.schemas.UserStats' /tmp/openapi.json

          echo '=== endpoints returning UserProfile/UserStats ==='
          jq -r '.paths | to_entries[] | .key as $p | .value | to_entries[] | select(.value|tostring|test("UserProfile|UserStats")) | [$p,.key,((.value.summary // ""))] | @tsv' /tmp/openapi.json
