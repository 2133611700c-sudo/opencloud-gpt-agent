name: Call2Me Reset Schema

on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Call2Me agent update schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.call2me.app/openapi.json -o /tmp/openapi.json
          echo '=== agent endpoint ==='
          jq '.paths["/v1/agents/{agent_id}"]' /tmp/openapi.json
          echo '=== agent create endpoint ==='
          jq '.paths["/v1/agents"].post' /tmp/openapi.json
          echo '=== agent-related schemas with greeting fields ==='
          jq '.components.schemas | with_entries(select((.value|tostring) | test("begin_message|begin_message_mode|system_prompt|response_engine")))' /tmp/openapi.json
