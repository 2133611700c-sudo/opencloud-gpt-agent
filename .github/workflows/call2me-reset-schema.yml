name: Call2Me Reset Schema

# Reused registered diagnostic workflow for a read-only OpenAPI payment schema check.
on:
  push:
    branches:
      - feat/openclaw-vendor-phone-calls
    paths:
      - '.github/workflows/call2me-reset-schema.yml'

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Call2Me payment and number purchase schemas
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 15 --max-time 45 https://api.call2me.app/openapi.json -o /tmp/openapi.json

          jq '{
            topup_path:(.paths["/v1/payments/topup"].post // null),
            buy_path:(.paths["/v1/phone-numbers/buy"].post // null),
            schemas:.components.schemas
          }' /tmp/openapi.json > /tmp/raw.json

          TOPUP_REF="$(jq -r '.topup_path.requestBody.content["application/json"].schema["$ref"] // empty' /tmp/raw.json)"
          BUY_REF="$(jq -r '.buy_path.requestBody.content["application/json"].schema["$ref"] // empty' /tmp/raw.json)"
          TOPUP_NAME="${TOPUP_REF##*/}"
          BUY_NAME="${BUY_REF##*/}"

          jq -n \
            --arg topup_ref "$TOPUP_REF" \
            --arg buy_ref "$BUY_REF" \
            --argjson topup_op "$(jq '.topup_path | {summary,description,requestBody,responses}' /tmp/raw.json)" \
            --argjson buy_op "$(jq '.buy_path | {summary,description,requestBody,responses}' /tmp/raw.json)" \
            --argjson topup_schema "$(jq --arg n "$TOPUP_NAME" '.schemas[$n] // null' /tmp/raw.json)" \
            --argjson buy_schema "$(jq --arg n "$BUY_NAME" '.schemas[$n] // null' /tmp/raw.json)" \
            '{topup_ref:$topup_ref,topup_schema:$topup_schema,topup_operation:$topup_op,buy_ref:$buy_ref,buy_schema:$buy_schema,buy_operation:$buy_op}' \
            > /tmp/payment-schema.json

          cat /tmp/payment-schema.json
      - name: Upload sanitized schema evidence
        uses: actions/upload-artifact@v5
        with:
          name: call2me-payment-schema-${{ github.run_id }}
          path: /tmp/payment-schema.json
          retention-days: 1
          if-no-files-found: error
