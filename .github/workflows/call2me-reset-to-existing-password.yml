name: Call2Me Reset To Existing Password

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-reset-to-existing-password.yml']

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API: https://api.call2me.app/v1
      EMAIL: 2133611700c@gmail.com
      PAYLOAD_API: https://api.github.com/repos/2133611700c-sudo/opencloud-gpt-agent/contents/ops/agent-control/call2me-secure-reset-once/payload.b64?ref=feat%2Fopenclaw-vendor-phone-calls
    steps:
      - name: Generate one-time inbound key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem 2>/dev/null
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem

      - name: Upload inbound public key
        uses: actions/upload-artifact@v5
        with:
          name: call2me-reset-once-key-${{ github.run_id }}
          path: /tmp/public.pem
          retention-days: 1
          if-no-files-found: error

      - name: Wait for encrypted reset payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=false
          for attempt in $(seq 1 90); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/payload.b64 -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
              "${PAYLOAD_API}&nonce=${GITHUB_RUN_ID}-${attempt}")"
            if [ "$code" = "200" ]; then found=true; break; fi
            sleep 4
          done
          [ "$found" = "true" ] || exit 20
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/payload.enc -out /tmp/payload.json \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          TOKEN="$(jq -r '.reset_token // empty' /tmp/payload.json)"
          PASSWORD="$(jq -r '.password // empty' /tmp/payload.json)"
          [ -n "$TOKEN" ] && [ "${#PASSWORD}" -ge 8 ] || exit 21
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$PASSWORD"
          printf '%s' "$TOKEN" > /tmp/token
          printf '%s' "$PASSWORD" > /tmp/password
          rm -f /tmp/payload.json /tmp/payload.enc /tmp/payload.b64

      - name: Reset password
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/token)"
          PASSWORD="$(cat /tmp/password)"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$PASSWORD"
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/reset.json -w '%{http_code}' \
            -X POST "$API/auth/reset-password" -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg t "$TOKEN" --arg p "$PASSWORD" '{token:$t,new_password:$p}')")"
          echo "reset_http=$CODE"
          if [[ ! "$CODE" =~ ^2 ]]; then jq -r '.detail // .message // "reset failed"' /tmp/reset.json || true; exit 30; fi

      - name: Verify login
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(cat /tmp/password)"
          echo "::add-mask::$PASSWORD"
          CODE="$(curl -sS --connect-timeout 15 --max-time 45 -o /tmp/login.json -w '%{http_code}' \
            -X POST "$API/auth/login" -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p}')")"
          echo "login_http=$CODE"
          if [[ ! "$CODE" =~ ^2 ]]; then exit 31; fi
          echo '{"reset":true,"login":true}' > /tmp/report.json
          rm -f /tmp/token /tmp/password /tmp/private.pem /tmp/login.json /tmp/reset.json

      - name: Upload sanitized result
        uses: actions/upload-artifact@v5
        with:
          name: call2me-reset-once-result-${{ github.run_id }}
          path: /tmp/report.json
          retention-days: 1
          if-no-files-found: error
