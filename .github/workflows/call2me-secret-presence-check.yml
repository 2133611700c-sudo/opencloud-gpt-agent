name: Call2Me Secret Presence Check

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-secret-presence-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CALL2ME_API_KEY: ${{ secrets.CALL2ME_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Check presence only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CALL2ME_API_KEY:-}" ] && echo 'CALL2ME_API_KEY=PRESENT' || echo 'CALL2ME_API_KEY=MISSING'
          [ -n "${OPENAI_API_KEY:-}" ] && echo 'OPENAI_API_KEY=PRESENT' || echo 'OPENAI_API_KEY=MISSING'
          [ -n "${RESEND_API_KEY:-}" ] && echo 'RESEND_API_KEY=PRESENT' || echo 'RESEND_API_KEY=MISSING'
