name: OpenClaw Persistent Secret Audit

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-secret-smoke.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CALL2ME_API_KEY: ${{ secrets.CALL2ME_API_KEY }}
      OPENCLAW_CONTROL_SHARED_SECRET: ${{ secrets.OPENCLAW_CONTROL_SHARED_SECRET }}
      OPENCLAW_GITHUB_TOKEN: ${{ secrets.OPENCLAW_GITHUB_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CALL2ME_API_KEY:-}" ] && C=true || C=false
          [ -n "${OPENCLAW_CONTROL_SHARED_SECRET:-}" ] && S=true || S=false
          [ -n "${OPENCLAW_GITHUB_TOKEN:-}" ] && G=true || G=false
          echo "call2me_api_key_present=$C"
          echo "openclaw_control_shared_secret_present=$S"
          echo "openclaw_github_token_present=$G"
          jq -n --argjson call2me "$C" --argjson shared "$S" --argjson github "$G" \
            '{call2me_api_key_present:$call2me,openclaw_control_shared_secret_present:$shared,openclaw_github_token_present:$github,stable_wrapping_secret_available:($shared or $github)}' > /tmp/presence.json
          cat /tmp/presence.json

      - name: Require a stable wrapping secret
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.stable_wrapping_secret_available==true' /tmp/presence.json >/dev/null

      - name: Upload non-secret audit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: openclaw-secret-presence-${{ github.run_id }}
          path: /tmp/presence.json
          retention-days: 14
          if-no-files-found: warn
