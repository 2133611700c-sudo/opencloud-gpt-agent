name: Call2Me Persistent Secret Smoke

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/call2me-secret-smoke.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CALL2ME_API_KEY: ${{ secrets.CALL2ME_API_KEY }}
    steps:
      - name: Verify secret presence without disclosure
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CALL2ME_API_KEY:-}" ]; then
            echo 'call2me_api_key_present=false'
            exit 20
          fi
          echo 'call2me_api_key_present=true'
          echo "::add-mask::$CALL2ME_API_KEY"

      - name: Verify secret against live Call2Me
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$CALL2ME_API_KEY"
          CODE="$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/wallet.json -w '%{http_code}' \
            'https://api.call2me.app/v1/wallet/balance' -H "Authorization: Bearer $CALL2ME_API_KEY")"
          echo "wallet_http=$CODE"
          [[ "$CODE" =~ ^2 ]] || exit 30
          jq '{authenticated:true,balance:(.balance // .available_balance // .balance_usd // 0)}' /tmp/wallet.json
