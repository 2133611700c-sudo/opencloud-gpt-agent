name: OpenClaw V2 E2 Governance Sync

on:
  push:
    branches:
      - e2-governance-sync-run

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2/openclaw-clean-20261011
          fetch-depth: 20

      - name: Verify expected target head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "495b23b67d1226d4a79c8b640e56080dbbcaeda1"

      - name: Load and run staged governance script
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin e2-governance-sync-run
          git show origin/e2-governance-sync-run:scripts/e2-governance-sync.py > /tmp/e2-governance-sync.py
          python3 /tmp/e2-governance-sync.py

      - name: Validate governance diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-foundation.mjs
          python3 -m json.tool PROJECT_STATE.json >/dev/null
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' PROJECT_STATE.json docs/RESULTS_JOURNAL.md | sort)"
          test "$changed" = "$expected"

      - name: Commit governance checkpoint to target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenClaw V2 Machine'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_STATE.json docs/RESULTS_JOURNAL.md
          git commit -m 'docs(v2): record E2 durable Evidence PASS_HOSTED'
          git push origin HEAD:v2/openclaw-clean-20261011
