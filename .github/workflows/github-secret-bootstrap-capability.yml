name: GitHub Secret Bootstrap Capability

on:
  push:
    branches: [feat/openclaw-vendor-phone-calls]
    paths: ['.github/workflows/github-secret-bootstrap-capability.yml']

permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe repository secrets public-key endpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS --connect-timeout 15 --max-time 30 -o /tmp/public-key.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/actions/secrets/public-key")"
          echo "repository_secrets_public_key_http=$CODE"
          jq -n --arg code "$CODE" '{repository_secrets_public_key_http:$code,can_bootstrap_secret:($code=="200")}' > /tmp/capability.json
          cat /tmp/capability.json
          test "$CODE" = "200"

      - name: Upload sanitized capability
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: github-secret-bootstrap-capability-${{ github.run_id }}
          path: /tmp/capability.json
          retention-days: 14
          if-no-files-found: warn
