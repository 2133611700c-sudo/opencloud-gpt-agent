name: OpenClaw 2026.10.3 GitHub Full Acceptance

on:
  push:
    branches:
      - 'work/openclaw-2026.10.3-github-full-acceptance'
    paths:
      - '.github/workflows/openclaw-2026-10-3-github-full-acceptance.yml'
      - 'scripts/openclaw-2026-10-3-cli-inventory.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-2026-10-3-github-full-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory exact OpenClaw 10.3 surface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact candidate and matching first-party plugins
        shell: bash
        run: |
          set -euo pipefail
          npm install -g openclaw@2026.10.3 --allow-scripts=openclaw
          state_dir="$RUNNER_TEMP/openclaw-inventory-state"
          install -d -m 700 "$state_dir"
          echo "OPENCLAW_STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          openclaw setup --baseline --skip-bootstrap --workspace "$GITHUB_WORKSPACE" --json > /tmp/baseline.json
          openclaw plugins install @openclaw/deepseek-provider@2026.10.3
          openclaw plugins install @openclaw/duckduckgo-plugin@2026.10.3
          openclaw plugins install @openclaw/firecrawl-plugin@2026.10.3
      - name: Recursively inventory CLI plus plugins and skills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/inventory
          openclaw plugins list --json > artifacts/inventory/plugins.json
          openclaw skills list --json > artifacts/inventory/skills.json
          node scripts/openclaw-2026-10-3-cli-inventory.mjs | tee artifacts/inventory/inventory-run-summary.json
          node --input-type=module <<'NODE' > artifacts/inventory/summary.json
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('artifacts/inventory/cli-manifest.json', 'utf8'));
          const plugins = JSON.parse(readFileSync('artifacts/inventory/plugins.json', 'utf8'));
          const skills = JSON.parse(readFileSync('artifacts/inventory/skills.json', 'utf8'));
          const pluginRows = Array.isArray(plugins) ? plugins : (plugins.plugins ?? plugins.items ?? []);
          const skillRows = Array.isArray(skills) ? skills : (skills.skills ?? skills.items ?? []);
          const summary = {
            openclaw: manifest.openclawVersion,
            rootCommands: manifest.rootCommands,
            rootCommandCount: manifest.rootCommandCount,
            discoveredCommandPaths: manifest.discoveredCommandPaths,
            leafCommandPaths: manifest.leafCommandPaths,
            pluginCount: pluginRows.length,
            skillCount: skillRows.length,
            testedInThisJob: ['install','setup','plugins.install','plugins.list','skills.list','recursive cli help'],
          };
          process.stdout.write(JSON.stringify(summary, null, 2) + '\n');
          NODE
          cat artifacts/inventory/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026-10-3-full-inventory
          path: artifacts/inventory/
          if-no-files-found: error
          retention-days: 14

  wave1_live_core:
    name: Wave 1 - DeepSeek Research and native sub-agents
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: openclaw-v2-live
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENCLAW_DEEPSEEK_MODEL: deepseek/deepseek-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Detect GitHub Environment DeepSeek credential
        id: key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEEPSEEK_API_KEY:-}" && "${#DEEPSEEK_API_KEY}" -ge 8 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'DEEPSEEK_API_KEY_PRESENT=true'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'DEEPSEEK_API_KEY_MISSING_IN_GITHUB_ENVIRONMENT=true'
          fi
      - name: Record provider-dependent block
        if: steps.key.outputs.present != 'true'
        shell: bash
        run: |
          {
            echo '### BLOCKED: provider-dependent acceptance'
            echo 'GitHub Environment openclaw-v2-live did not inject DEEPSEEK_API_KEY.'
            echo 'No provider call was attempted; this is credential plumbing, not an OpenClaw capability failure.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install exact OpenClaw 10.3 and matching plugins
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g openclaw@2026.10.3 --allow-scripts=openclaw
          version_output="$(openclaw --version | tail -n 1 | tr -d '\r')"
          printf '%s\n' "$version_output"
          version_token="$(printf '%s\n' "$version_output" | awk '{print $2}')"
          test "$version_token" = '2026.10.3'
          state_dir="$RUNNER_TEMP/openclaw-wave1-state"
          install -d -m 700 "$state_dir"
          echo "OPENCLAW_STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          openclaw setup --baseline --skip-bootstrap --workspace "$GITHUB_WORKSPACE" --json > "$RUNNER_TEMP/openclaw-baseline.json"
          openclaw plugins install @openclaw/deepseek-provider@2026.10.3
          openclaw plugins install @openclaw/duckduckgo-plugin@2026.10.3
          openclaw plugins install @openclaw/firecrawl-plugin@2026.10.3
          openclaw config validate --json > "$RUNNER_TEMP/openclaw-config.json"
          openclaw doctor --lint --severity-min error --json > "$RUNNER_TEMP/openclaw-doctor.json"
      - name: A8 - live Research agent with DeepSeek plus web_search and web_fetch
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf a8-output
          node scripts/a8-vercel-acceptance.mjs
          test -s a8-output/a8-evidence.json
          cat a8-output/a8-evidence.json >> "$GITHUB_STEP_SUMMARY"
      - name: A9 - native sub-agent spawn, completion, parent resume and cleanup
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .a9-install-state
          bash scripts/a9-vercel-build.sh | tee "$RUNNER_TEMP/a9-safe-output.log"
          grep -q 'A9_PASS' "$RUNNER_TEMP/a9-safe-output.log"
      - name: Upload safe Wave 1 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026-10-3-github-wave1
          path: |
            a8-output/a8-evidence.json
          if-no-files-found: warn
          retention-days: 14
