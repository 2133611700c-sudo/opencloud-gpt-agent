name: OpenClaw DeepSeek Secret Presence

on:
  push:
    branches:
      - openclaw/deepseek-stored-auth-20261016
    paths:
      - .github/workflows/openclaw-deepseek-secret-presence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openclaw-v2-live
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Verify current environment secret availability without exposure
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY=PRESENT"
            exit 0
          fi
          echo "DEEPSEEK_API_KEY=MISSING"
          exit 2
