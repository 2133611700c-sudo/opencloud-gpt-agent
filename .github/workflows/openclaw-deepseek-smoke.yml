name: OpenClaw DeepSeek Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "ops/agent-control/deepseek-smoke/*.request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: openclaw-deepseek-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deepseek-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENCLAW_VERSION: "2026.10.3"
      OPENCLAW_ADVISOR_VERSION: "2026.10.3"
      DEEPSEEK_PLUGIN_VERSION: "2026.10.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Initialize isolated OpenClaw state
        shell: bash
        run: |
          set -euo pipefail
          STATE="${RUNNER_TEMP}/openclaw-deepseek-state"
          rm -rf "$STATE"
          mkdir -p "$STATE"
          chmod 700 "$STATE"
          echo "OPENCLAW_STATE_DIR=$STATE" >> "$GITHUB_ENV"
          echo "OPENCLAW_CONFIG_PATH=$STATE/openclaw.json" >> "$GITHUB_ENV"
          echo "OPENCLAW_DEEPSEEK_AUTH_EVIDENCE=ops/agent-control/reports/deepseek_health/stored-auth-live.json" >> "$GITHUB_ENV"

      - name: Require DeepSeek secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_API_KEY is not configured in GitHub Actions Secrets."
            exit 2
          fi

      - name: Install pinned OpenClaw
        run: npm install --global "openclaw@${OPENCLAW_VERSION}"

      - name: Install official DeepSeek provider
        run: openclaw plugins install "@openclaw/deepseek-provider@${DEEPSEEK_PLUGIN_VERSION}"

      - name: Store credential and prove stored-auth live path
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/openclaw-deepseek-auth-bootstrap.mjs --verify-live

      - name: Verify versions and provider catalog without secret env
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops/agent-control/reports/deepseek_health
          openclaw --version | tee ops/agent-control/reports/deepseek_health/openclaw-version.txt
          grep -q "2026.10.3" ops/agent-control/reports/deepseek_health/openclaw-version.txt
          openclaw models list --agent main --provider deepseek | tee ops/agent-control/reports/deepseek_health/catalog.txt
          grep -q "deepseek-flash" ops/agent-control/reports/deepseek_health/catalog.txt
          grep -q "deepseek-v4-pro" ops/agent-control/reports/deepseek_health/catalog.txt
          openclaw models auth list --provider deepseek --agent main --json > ops/agent-control/reports/deepseek_health/auth-list.json
          grep -q "deepseek" ops/agent-control/reports/deepseek_health/auth-list.json

      - name: Verify V4.1 Flash Think Max from stored auth
        shell: bash
        run: |
          set -euo pipefail
          OUT=ops/agent-control/reports/deepseek_health/thinking.json
          openclaw infer model run \
            --local \
            --model deepseek/deepseek-flash \
            --thinking max \
            --prompt "Reply with exactly: THINK_OK" \
            --json | tee "$OUT"
          jq -e '.ok == true and .provider == "deepseek"' "$OUT" >/dev/null
          grep -q "THINK_OK" "$OUT"

      - name: Verify V4.1 Flash tool call from stored auth
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          OUT=ops/agent-control/reports/deepseek_health/tool-call.json
          openclaw agent exec \
            "Use the shell command pwd exactly once. Do not create, edit, or delete files. Then reply with TOOL_OK followed by the pwd output." \
            --cwd "$TMP" \
            --model deepseek/deepseek-flash \
            --fallback deepseek/deepseek-v4-pro \
            --thinking max \
            --code-mode direct \
            --timeout 180 \
            --json | tee "$OUT"
          jq -e '.ok == true and .provider == "deepseek" and (.toolSummary.calls // 0) >= 1 and ((.toolSummary.tools // []) | index("exec") != null)' "$OUT" >/dev/null
          grep -q "TOOL_OK" "$OUT"
          rm -rf "$TMP"

      - name: Create deterministic vision fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import struct, zlib
          w = h = 64
          raw = b''.join(b'\x00' + bytes([255, 0, 0]) * w for _ in range(h))
          def chunk(name, data):
              return struct.pack('>I', len(data)) + name + data + struct.pack('>I', zlib.crc32(name + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('/tmp/deepseek-red-square.png', 'wb').write(png)
          PY

      - name: Verify V4.1 Flash vision from stored auth
        shell: bash
        run: |
          set -euo pipefail
          OUT=ops/agent-control/reports/deepseek_health/vision.json
          openclaw infer model run \
            --local \
            --model deepseek/deepseek-flash \
            --thinking low \
            --file /tmp/deepseek-red-square.png \
            --prompt "Identify the dominant color in this image. Reply with exactly: RED_SQUARE" \
            --json | tee "$OUT"
          jq -e '.ok == true and .provider == "deepseek"' "$OUT" >/dev/null
          grep -q "RED_SQUARE" "$OUT"

      - name: Stage pinned audited ECC skills for native discovery
        shell: bash
        run: |
          set -euo pipefail
          PIN=ops/agent-control/ecc/ECC_SOURCE_PIN.v1.json
          REPO="$(jq -r '.repository' "$PIN")"
          COMMIT="$(jq -r '.commit' "$PIN")"
          ROOT="$(jq -r '.skills_root' "$PIN")"
          EXPECTED="$(jq -r '.expected_skill_count' "$PIN")"
          DIR="${RUNNER_TEMP}/ecc-native-source"
          rm -rf "$DIR"
          git init -q "$DIR"
          git -C "$DIR" remote add origin "$REPO"
          git -C "$DIR" fetch -q --depth 1 origin "$COMMIT"
          git -C "$DIR" checkout -q --detach FETCH_HEAD
          ACTUAL_SHA="$(git -C "$DIR" rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$COMMIT" ]
          COUNT="$(find "$DIR/$ROOT" -name SKILL.md -type f | wc -l | tr -d ' ')"
          [ "$COUNT" = "$EXPECTED" ]
          echo "$ACTUAL_SHA" > ops/agent-control/reports/deepseek_health/ecc-source-sha.txt
          echo "$COUNT" > ops/agent-control/reports/deepseek_health/ecc-skill-count.txt
          echo "ECC_NATIVE_SKILLS_DIR=$DIR/$ROOT" >> "$GITHUB_ENV"

      - name: Build isolated read-only native skill config
        shell: bash
        run: |
          set -euo pipefail
          BASE="$OPENCLAW_CONFIG_PATH"
          SKILL_CONFIG="${OPENCLAW_STATE_DIR}/skill-smoke.json"
          cp "$BASE" "$SKILL_CONFIG"
          jq \
            --arg dir "$ECC_NATIVE_SKILLS_DIR" \
            '.skills.load.extraDirs = [$dir]
             | .agents.defaults.skills = ["verification-loop", "agent-security-hardening", "plan-orchestrate"]
             | .tools.allow = ["skills_search", "skills_read"]
             | .tools.deny = ["exec", "process", "write", "edit", "apply_patch", "browser", "gateway"]' \
            "$SKILL_CONFIG" > "$SKILL_CONFIG.tmp"
          mv "$SKILL_CONFIG.tmp" "$SKILL_CONFIG"
          echo "OPENCLAW_SKILL_SMOKE_CONFIG=$SKILL_CONFIG" >> "$GITHUB_ENV"

      - name: Verify native skills_search and skills_read from stored auth
        shell: bash
        run: |
          set -euo pipefail
          export OPENCLAW_CONFIG_PATH="$OPENCLAW_SKILL_SMOKE_CONFIG"
          TMP="$(mktemp -d)"
          OUT=ops/agent-control/reports/deepseek_health/native-skills.json
          openclaw agent exec \
            "Use skills_search to find the installed verification-loop skill, then use skills_read to read that exact skill. Do not use any other tool. After both calls succeed, reply exactly SKILL_DISCOVERY_OK." \
            --cwd "$TMP" \
            --model deepseek/deepseek-flash \
            --fallback deepseek/deepseek-v4-pro \
            --thinking high \
            --code-mode direct \
            --timeout 180 \
            --json | tee "$OUT"
          jq -e '.ok == true and .provider == "deepseek" and (.toolSummary.calls // 0) >= 2 and ((.toolSummary.tools // []) | index("skills_search") != null) and ((.toolSummary.tools // []) | index("skills_read") != null)' "$OUT" >/dev/null
          grep -q "SKILL_DISCOVERY_OK" "$OUT"
          rm -rf "$TMP"

      - name: Scan evidence for secret leakage
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEEPSEEK_API_KEY:-}" ] && grep -R -F -- "$DEEPSEEK_API_KEY" ops/agent-control/reports/deepseek_health; then
            echo "DeepSeek secret leaked into smoke evidence."
            exit 4
          fi

      - name: Write smoke report
        if: always()
        shell: bash
        run: |
          mkdir -p ops/agent-control/reports/deepseek_health
          cat > ops/agent-control/reports/deepseek_health/latest.md <<EOF
          # OpenClaw DeepSeek Stored-Auth Smoke

          - timestamp_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - openclaw_version: ${OPENCLAW_VERSION}
          - plugin: @openclaw/deepseek-provider@${DEEPSEEK_PLUGIN_VERSION}
          - auth_agent: main
          - auth_transport: GitHub Actions Secret -> stdin -> OpenClaw stored auth
          - verification_env_contains_secret: false
          - primary_model: deepseek/deepseek-flash
          - fallback_model: deepseek/deepseek-v4-pro
          - verified_surfaces_requested: stored auth, live provider probe, agent exec, catalog, thinking=max, exec tool-call, vision, native skills_search, native skills_read
          - ecc_source: pinned audited commit from ECC_SOURCE_PIN.v1.json
          - native_skill_allowlist: verification-loop, agent-security-hardening, plan-orchestrate
          - native_skill_tool_policy: read-only skills_search + skills_read; exec/write/edit/process/browser/gateway denied
          - secret_value_logged: false
          - run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: openclaw-deepseek-${{ github.run_id }}
          path: ops/agent-control/reports/deepseek_health/
          if-no-files-found: warn
          retention-days: 30
