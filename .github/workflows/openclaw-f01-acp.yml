name: OpenClaw F01 ACP Acceptance

on:
  push:
    branches:
      - 'work/openclaw-2026.10.3-github-full-acceptance'
    paths:
      - '.github/workflows/openclaw-f01-acp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acp:
    name: F01 acp protocol and process acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact OpenClaw 2026.10.3
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: v2026.10.3
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Enable pnpm
        run: corepack enable

      - name: Install exact upstream dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify ACP CLI is callable
        run: node openclaw.mjs acp --help

      - name: Run ACP client and protocol tests
        run: |
          pnpm exec vitest run \
            src/acp/client.test.ts \
            src/acp/client.process.test.ts \
            src/acp/translator.session-setup.test.ts \
            src/cli/acp-cli-exit.process.test.ts

      - name: Record exact release identity
        run: |
          printf 'tag=v2026.10.3\ncommit=' > /tmp/acp-release.txt
          git rev-parse HEAD >> /tmp/acp-release.txt
          cat /tmp/acp-release.txt
