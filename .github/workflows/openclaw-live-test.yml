name: OpenClaw Live Test
on:
  push:
    branches: ['work/openclaw-live-test']
    paths: ['.github/workflows/openclaw-live-test.yml', 'task.txt']
  workflow_dispatch:
    inputs:
      message:
        description: Task for the agent
        required: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      INPUT_MSG: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install, configure, run
        run: |
          set +e
          OUT="$RUNNER_TEMP/out.txt"; : > "$OUT"
          export OPENCLAW_STATE_DIR="$RUNNER_TEMP/openclaw-state"
          install -d -m 700 "$OPENCLAW_STATE_DIR"
          {
            echo "### install"
            npm install -g openclaw@2026.10.3 --allow-scripts=openclaw 2>&1 | tail -5
            openclaw --version
            openclaw plugins install @openclaw/deepseek-provider@2026.10.3 2>&1 | tail -5
            openclaw plugins install @openclaw/duckduckgo-plugin@2026.10.3 2>&1 | tail -5
            echo "### onboard"
            openclaw onboard --non-interactive --mode local --auth-choice deepseek-api-key --deepseek-api-key "$DEEPSEEK_API_KEY" --skip-health --accept-risk 2>&1 | tail -20
            echo "onboard_exit=${PIPESTATUS[0]}"
            echo "### models"
            openclaw models list --provider deepseek 2>&1 | tail -20
            echo "### agent help"
            openclaw agent --help 2>&1 | head -40
            openclaw agent exec --help 2>&1 | head -40
            echo "### task"
            MSG="${INPUT_MSG:-$(cat task.txt 2>/dev/null)}"
            MSG="${MSG:-Find the current weather in Los Angeles using web search and answer in one sentence with the source.}"
            printf '%s' "$MSG" > "$RUNNER_TEMP/msg.txt"
            echo "$MSG"
            echo "### run"
            timeout 400 openclaw agent exec --message-file "$RUNNER_TEMP/msg.txt" --model deepseek/deepseek-v4-flash --json --timeout 300 2>&1 | tail -80
            echo "run_exit=${PIPESTATUS[0]}"
          } > "$OUT" 2>&1
          sed -i "s/${DEEPSEEK_API_KEY}/***REDACTED***/g" "$OUT"
          mkdir -p results; cp "$OUT" "results/run-${GITHUB_RUN_ID}.txt"
          git config user.name "openclaw-bot"; git config user.email "bot@users.noreply.github.com"
          git add results; git commit -m "OpenClaw run ${GITHUB_RUN_ID} output" && git push
