name: OpenClaw Mobile Cloud Runner

on:
  workflow_call:
    inputs:
      task_file:
        required: true
        type: string
      force_rerun:
        required: false
        type: boolean
        default: false
      dispatch_file:
        required: false
        type: string
        default: ""
    secrets:
      DEEPSEEK_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      task_file:
        description: Task file path under ops/agent-control/tasks
        required: true
        type: string
      force_rerun:
        description: Bypass task dedupe
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  actions: read

concurrency:
  group: openclaw-mobile-${{ github.ref }}-${{ inputs.task_file || github.event.inputs.task_file }}
  cancel-in-progress: false

jobs:
  cloud-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK_FILE: ${{ inputs.task_file || github.event.inputs.task_file }}
      FORCE_RERUN: ${{ (inputs.force_rerun || false) && 'true' || github.event.inputs.force_rerun || 'false' }}
      DISPATCH_FILE: ${{ inputs.dispatch_file || '' }}
      OPENCLAW_LATEST_FILE: ops/agent-control/reports/openclaw-latest.json
      OPENCLAW_ARTIFACT_NAME: openclaw-mobile-${{ github.run_id }}
      DEDUPE_WINDOW_MINUTES: "15"
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OPENCLAW_ADVISOR_VERSION: "2026.10.1"
      DEEPSEEK_PLUGIN_VERSION: "2026.10.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify orchestration and advisory boundaries
        run: node --test tests/openclaw-ecc-router.test.mjs tests/openclaw-task-type-sync.test.mjs tests/openclaw-secret-detection.test.mjs tests/openclaw-deepseek-advisor.test.mjs

      - name: Detect DeepSeek configuration
        id: deepseek_config
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install isolated OpenClaw advisor runtime
        if: steps.deepseek_config.outputs.configured == 'true'
        continue-on-error: true
        run: npm install --global "openclaw@${OPENCLAW_ADVISOR_VERSION}"

      - name: Install isolated DeepSeek provider
        if: steps.deepseek_config.outputs.configured == 'true'
        continue-on-error: true
        run: openclaw plugins install "@openclaw/deepseek-provider@${DEEPSEEK_PLUGIN_VERSION}"

      - name: Run bounded DeepSeek planner advisory
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/openclaw-deepseek-advisor.mjs plan

      - name: Run routed OpenClaw task without model secret
        id: run_task
        continue-on-error: true
        run: node scripts/openclaw-cloud-orchestrator.mjs

      - name: Run bounded DeepSeek independent judge advisory
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/openclaw-deepseek-advisor.mjs judge

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.OPENCLAW_ARTIFACT_NAME }}
          path: |
            ops/agent-control/reports/
            ops/openclaw/reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit evidence
        if: always()
        id: commit_evidence
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$OPENCLAW_LATEST_FILE" ]; then
            echo "Missing $OPENCLAW_LATEST_FILE"
            exit 1
          fi
          cp "$OPENCLAW_LATEST_FILE" /tmp/openclaw-latest-current.json
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- ops/agent-control/STATUS.md 2>/dev/null || true
          git checkout "origin/${GITHUB_REF_NAME}" -- "$OPENCLAW_LATEST_FILE" 2>/dev/null || true
          cp /tmp/openclaw-latest-current.json "$OPENCLAW_LATEST_FILE"
          node scripts/update-openclaw-status.mjs --latest "$OPENCLAW_LATEST_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/agent-control/reports/ ops/agent-control/STATUS.md
          if git diff --cached --quiet; then
            echo "evidence_commit_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ops(agent): mobile cloud evidence for $(basename "$TASK_FILE" .json)"
          for ATTEMPT in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              SHA="$(git rev-parse HEAD)"
              echo "evidence_commit_sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            [ "$ATTEMPT" -lt 3 ] || exit 1
            sleep "$ATTEMPT"
          done

      - name: Finalize evidence metadata
        if: always() && steps.commit_evidence.outputs.evidence_commit_sha != ''
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.commit_evidence.outputs.evidence_commit_sha }}"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- ops/agent-control/STATUS.md "$OPENCLAW_LATEST_FILE"
          node -e "import('./scripts/lib/openclaw-task-lib.mjs').then((m) => { const latest = m.updateLatestEvidenceCommit(process.argv[1]); m.writeJson(m.latestReportFile, latest); });" "$SHA"
          node scripts/update-openclaw-status.mjs --latest "$OPENCLAW_LATEST_FILE" --evidence-commit-sha "$SHA"
          git add -f "$OPENCLAW_LATEST_FILE" ops/agent-control/STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops(agent): finalize mobile cloud evidence"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce deterministic task status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$OPENCLAW_LATEST_FILE" ] || exit 1
          STATUS="$(jq -r '.status' "$OPENCLAW_LATEST_FILE")"
          EXPECTED="$(jq -r '.expected_status' "$OPENCLAW_LATEST_FILE")"
          if [ "$STATUS" = "$EXPECTED" ] || [ "$STATUS" = "PASS" ] || [ "$STATUS" = "DEGRADED" ]; then
            exit 0
          fi
          echo "Task ended with $STATUS; expected $EXPECTED"
          exit 1
