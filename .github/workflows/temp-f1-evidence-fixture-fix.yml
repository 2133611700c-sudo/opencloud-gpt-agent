name: Temporary F1 Evidence fixture repair

on:
  push:
    branches:
      - work/f1-ci-production-data-expectation-20261014
    paths:
      - .github/workflows/temp-f1-evidence-fixture-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Research admission Evidence fixture repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/integration/evidence-postgres-store-e2e.mjs')
          s = p.read_text()
          old = """  await researchWorker.runTask(taskId);
            const dataWorker = createDataWorker({ kernel: createPostgresDataAdapter({ query }), workerId: `e3a-data-${id}`, leaseSeconds: 60 });
            if (Array.isArray(payload?.requiredFields) && payload.requiredFields.includes('missing')) {
              await assert.rejects(() => dataWorker.runTask(taskId), (error) => error.code === 'REQUIRED_FIELD_MISSING');
            } else assert.equal((await dataWorker.runTask(taskId)).execution.taskStatus, 'SUCCESS');
          """
          new = """  const rejectsAdmission = Array.isArray(payload?.requiredFields) && payload.requiredFields.includes('missing');
            if (rejectsAdmission) {
              await assert.rejects(() => researchWorker.runTask(taskId), (error) => error.code === 'REQUIRED_FIELDS_NOT_PROVEN');
            } else {
              assert.equal((await researchWorker.runTask(taskId)).execution.status, 'SUCCESS');
              const dataWorker = createDataWorker({ kernel: createPostgresDataAdapter({ query }), workerId: `e3a-data-${id}`, leaseSeconds: 60 });
              assert.equal((await dataWorker.runTask(taskId)).execution.taskStatus, 'SUCCESS');
            }
          """
          if old not in s:
              raise SystemExit('store fixture target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/integration/evidence-runtime-lifecycle-e2e.mjs')
          s = p.read_text()
          old = """  const researchExecution = await researchWorker.runTask(taskId);
            assert.equal(researchExecution.status, 'EXECUTED');
            assert.equal(researchExecution.execution.status, 'SUCCESS');

            const dataWorker = createDataWorker({
              kernel: createPostgresDataAdapter({ query }),
              workerId: `synthetic-e3-data-${id}`,
              leaseSeconds: 60,
              heartbeatIntervalMs: 10_000,
            });
            if (mode === 'failure') {
              await assert.rejects(
                () => dataWorker.runTask(taskId),
                (error) => error?.code === 'REQUIRED_FIELD_MISSING',
              );
            } else {
              const dataExecution = await dataWorker.runTask(taskId);
              assert.equal(dataExecution.status, 'EXECUTED');
              assert.equal(dataExecution.execution.taskStatus, 'SUCCESS');
            }
          """
          new = """  if (mode === 'failure') {
              await assert.rejects(
                () => researchWorker.runTask(taskId),
                (error) => error?.code === 'REQUIRED_FIELDS_NOT_PROVEN',
              );
            } else {
              const researchExecution = await researchWorker.runTask(taskId);
              assert.equal(researchExecution.status, 'EXECUTED');
              assert.equal(researchExecution.execution.status, 'SUCCESS');

              const dataWorker = createDataWorker({
                kernel: createPostgresDataAdapter({ query }),
                workerId: `synthetic-e3-data-${id}`,
                leaseSeconds: 60,
                heartbeatIntervalMs: 10_000,
              });
              const dataExecution = await dataWorker.runTask(taskId);
              assert.equal(dataExecution.status, 'EXECUTED');
              assert.equal(dataExecution.execution.taskStatus, 'SUCCESS');
            }
          """
          if old not in s:
              raise SystemExit('lifecycle fixture target not found')
          s = s.replace(old, new, 1)
          old2 = """      failureRead.nodeErrors.some(({ nodeKey, error }) => nodeKey === 'data' && error?.code === 'REQUIRED_FIELD_MISSING'),
                'failure Evidence artifact must preserve the Data terminal error code',
          """
          new2 = """      failureRead.nodeErrors.some(({ nodeKey, error }) => nodeKey === 'research' && error?.code === 'REQUIRED_FIELDS_NOT_PROVEN'),
                'failure Evidence artifact must preserve the Research admission terminal error code',
          """
          if old2 not in s:
              raise SystemExit('lifecycle assertion target not found')
          p.write_text(s.replace(old2, new2, 1))
          PY
          git diff --check
          npm test
      - name: Commit repaired fixtures and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-f1-evidence-fixture-fix.yml
          git add tests/integration/evidence-postgres-store-e2e.mjs tests/integration/evidence-runtime-lifecycle-e2e.mjs
          git diff --cached --check
          git commit -m 'test(v2): align Evidence fixtures with Research admission'
          git push origin "HEAD:${GITHUB_REF_NAME}"
