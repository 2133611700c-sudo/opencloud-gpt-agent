          entry=f'''\n\n{marker}\n\nCode head `{CODE_HEAD}` passed exact CI `{CODE_CI}` / job `{CODE_JOB}` SUCCESS. After that checkpoint, Neon Function `openclawv2mobile` deployment `4` accepted real authenticated USER HTTP request `{REQUEST}`. Stable idempotency maps to exactly one task `{TASK}`; persisted source is authenticated_http/operator/requestId and contains no credential.\n\nSame task: Research SUCCESS -> production Data SUCCESS -> task SUCCESS / ALL_NODES_SUCCEEDED. Runtime receipt `{RECEIPT}` observed OpenClaw `2026.9.8`, requested `deepseek/deepseek-flash`, thinking `max`, native `web_search` + `web_fetch`, 4 calls, 0 failures. Accounting `{ACCOUNTING}`: hit `12544`, miss `6475`, completion `723`, total `19742`, latency `21792ms`, cost `$0.002885`, pricing `deepseek-v4.1-flash-2026-09-10`. Reservation `$0.10` / `50000` reconciled to `$0.002885` / `19742`; unresolved `0`.\n\nEvidence `{ARTIFACT}` SHA256 `{SHA}` contains the same terminal task/Data/sources/accounting/receipt. Independent browser verification opened `{BASE}/tasks/{TASK}/phone` over HTTPS with `[SUCCESS]`, same task and `$0.002885`, then its `/deep-log` over HTTPS with the same task, artifact and SHA. Post-final Neon inventory: tasks22, active0, RUNNING0, RESERVED0, accounting9, artifacts15, receipts5.\n\nConclusion: all 15 mandatory 48h items and all 9 acceptance tests have sufficient code/hosted/live proof. `walking_skeleton_gate=PASS_LIVE`; `remaining_48h_gaps={{}}`. `main` untouched. GitHub-specific webhook/admin ingress is not claimed and is not required for the proved allowed USER ingress. Function logs show a pg SSL-mode future-compatibility warning; current behavior is verify-full and this is post-48h dependency hardening.\n'''.encode('utf-8')
