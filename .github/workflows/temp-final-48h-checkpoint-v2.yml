          s['live_capabilities']['current_full_production_vertical']='PASS_LIVE'
          s['live_capabilities']['final_external_paid_success']={
            'status':'PASS_LIVE','entry_type':'authenticated_http','principal_id':'operator','request_id':REQUEST,
            'idempotency_key':f'user:http:operator:{REQUEST}','task_id':TASK,'task_status':'SUCCESS',
            'terminal_reason':'ALL_NODES_SUCCEEDED','research_status':'SUCCESS','data_status':'SUCCESS',
