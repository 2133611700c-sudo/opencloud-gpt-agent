          rp['note'] = 'F1/F2/P2/I1c and the final external paid USER HTTP -> Phone/deep-log chain are proven. GitHub-specific webhook ingress remains a separate non-blocking capability, not part of the completed allowed USER ingress proof.'

          inv = state['hosted_postgres']['latest_read_only_inventory']
          inv.update({
              'observed_on': '2026-10-15T12:38:53Z',
              'tasks': 22,
              'active_tasks': 0,
              'running_nodes': 0,
              'unresolved_reservations': 0,
              'llm_accounting_rows': 9,
              'evidence_artifacts': 15,
              'runtime_receipts': 5,
              'scope_note': 'Post-final external live audit: task SUCCESS, no active/RUNNING/RESERVED state; accounting/artifact/receipt counts increased exactly once from the paid external task.'
          })

          lc = state['live_capabilities']
          lc['current_full_production_vertical'] = 'PASS_LIVE'
          lc['final_external_paid_success'] = {
