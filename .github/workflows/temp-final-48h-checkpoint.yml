          hp['success_artifact_sha256'] = ARTIFACT_SHA
          hp['observed_at'] = '2026-10-15T12:38:53Z'
          hp['proof_note'] = 'Deployment 4 accepted the authenticated external USER request; final paid task completed and public HTTPS /phone plus /deep-log were independently opened and matched the same task/artifact/hash.'
