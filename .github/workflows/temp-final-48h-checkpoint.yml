          ev['proof_limit'] = 'Final paid external authenticated USER HTTP task has receipt-bound durable Evidence plus independently re-opened public HTTPS Phone/deep-log on the same task/artifact/hash. Historical proof boundaries remain preserved.'
          ev['final_external_task_id'] = TASK
          ev['final_external_runtime_receipt_id'] = RECEIPT
          ev['final_external_artifact_id'] = ARTIFACT
          ev['final_external_artifact_sha256'] = ARTIFACT_SHA

          phone = state['phone_and_deep_log']
