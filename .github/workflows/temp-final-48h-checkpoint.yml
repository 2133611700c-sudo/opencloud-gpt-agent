              'accounting_id': ACCOUNTING,
              'prompt_cache_hit_tokens': 12544,
              'prompt_cache_miss_tokens': 6475,
              'completion_tokens': 723,
              'total_tokens': 19742,
              'cost_usd': 0.002885,
              'latency_ms': 21792,
              'pricing_version': 'deepseek-v4.1-flash-2026-09-10',
              'reservation_status': 'RECONCILED',
              'reserved_cost_usd': 0.1,
              'reserved_tokens': 50000,
