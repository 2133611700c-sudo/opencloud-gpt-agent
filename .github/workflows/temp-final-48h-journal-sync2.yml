name: Temp Final 48h Journal Sync 2

on:
  push:
    branches:
      - work/final-48h-journal-sync2-20261015
    paths:
      - .github/workflows/temp-final-48h-journal-sync2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append canonical journal checkpoint
        run: python scripts/temp-final-48h-journal-sync.py
      - name: Validate final synchronized tree
        run: |
          set -euo pipefail
          npm run validate:foundation
          npm test
          npm run health
          git diff --check
      - name: Commit sync and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'OpenClaw V2 checkpoint bot'
          git config user.email '2133611700c@gmail.com'
          git rm .github/workflows/temp-final-48h-journal-sync2.yml scripts/temp-final-48h-journal-sync.py
          git add docs/RESULTS_JOURNAL.md docs/EXECUTION_LOG.md
          git diff --cached --check
          git commit -m 'docs(v2): sync final live proof into canonical journals'
          git push origin HEAD:work/final-48h-journal-sync2-20261015
