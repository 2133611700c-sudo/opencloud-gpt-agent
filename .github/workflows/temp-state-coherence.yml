name: Temp State Coherence

on:
  push:
    branches:
      - work/state-coherence-20261015
    paths:
      - .github/workflows/temp-state-coherence.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair current-state coherence
        run: python scripts/temp-state-coherence.py
      - name: Validate state and full Node suite
        run: |
          set -euo pipefail
          npm run validate:foundation
          npm test
          npm run health
          git diff --check
      - name: Commit verified tree without temporary writer files
        run: |
          set -euo pipefail
          git config user.name 'OpenClaw V2 state coherence bot'
          git config user.email '2133611700c@gmail.com'
          git rm .github/workflows/temp-state-coherence.yml scripts/temp-state-coherence.py
          git add PROJECT_STATE.json
          git diff --cached --check
          git commit -m 'fix(v2): eliminate current-state truth drift'
          git push origin HEAD:work/state-coherence-20261015
