name: OpenClaw V2 CI

on:
  push:
    branches:
      - 'v2/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openclaw
          POSTGRES_PASSWORD: openclaw
          POSTGRES_DB: openclaw_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openclaw -d openclaw_v2_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      PGPASSWORD: openclaw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate foundation
        run: npm run validate:foundation
      - name: Run Node tests
        run: npm test
      - name: Run health check
        run: npm run health
      - name: Report live prerequisite presence
        id: prereqs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DATABASE_URL:-}" ]]; then
            echo "LIVE_DATABASE_URL=PRESENT"
            echo "database_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_DATABASE_URL=MISSING"
            echo "database_present=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "LIVE_DEEPSEEK_API_KEY=PRESENT"
            echo "deepseek_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "LIVE_DEEPSEEK_API_KEY=MISSING"
            echo "deepseek_present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply PostgreSQL migrations
        run: |
          set -euo pipefail
          for migration in migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h 127.0.0.1 -U openclaw -d openclaw_v2_test -v ON_ERROR_STOP=1 -f "${migration}"
          done
      - name: Run PostgreSQL kernel assertions
        run: |
          set -euo pipefail
          for test_sql in tests/sql/*.sql; do
            echo "Running ${test_sql}"
            psql -h 127.0.0.1 -U openclaw -d openclaw_v2_test -v ON_ERROR_STOP=1 -f "${test_sql}"
          done
      - name: Verify hosted Neon persistence when DATABASE_URL exists
        if: steps.prereqs.outputs.database_present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT CASE WHEN (
            SELECT count(*) FROM information_schema.tables
            WHERE table_schema='public' AND table_name IN (
              'tasks','task_nodes','task_node_dependencies','llm_accounting','artifacts',
              'registry_agents','registry_skills','approval_requests','budget_reservations'
            )
          ) = 9 THEN 1 ELSE 1/0 END AS core_tables_ok;

          SELECT CASE WHEN (
            SELECT count(DISTINCT p.proname)
            FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname='public' AND p.proname IN (
              'claim_next_node','heartbeat_node','complete_node_success','requeue_node_retry',
              'reserve_node_budget','reconcile_node_budget','release_node_budget','create_lite_research_task',
              'block_task_nodes','cascade_block_descendants','finalize_task','fail_node_terminal',
              'release_reservations_for_lease','record_llm_call'
            )
          ) = 14 THEN 1 ELSE 1/0 END AS core_functions_ok;

          BEGIN;
          SELECT * FROM create_lite_research_task(
            ('ci-hosted-smoke-' || gen_random_uuid()::text)::varchar(128),
            'CI hosted persistence smoke',
            '{"source":"github-actions"}'::jsonb,
            0.010000,
            1000,
            4,
            NOW() + INTERVAL '5 minutes'
          );
          ROLLBACK;
          SQL

      - name: Set up supported Node for pinned OpenClaw runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned OpenClaw CLI
        run: |
          set -euo pipefail
          npm install -g openclaw@2026.9.8 --allow-scripts=openclaw
          version_output="$(openclaw --version | tail -n 1 | tr -d '\r')"
          echo "$version_output"
          version_token="$(printf '%s\n' "$version_output" | awk '{print $2}')"
          test "$version_token" = "2026.9.8"
      - name: Prepare isolated OpenClaw V2 trust scope
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/openclaw-v2-state"
          install -d -m 700 "$state_dir"
          test ! -e "$state_dir/state/openclaw.sqlite"
          echo "OPENCLAW_STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          echo "OPENCLAW_V2_STATE_DIR=$state_dir" >> "$GITHUB_ENV"
      - name: Install matching official DeepSeek provider plugin
        run: |
          set -euo pipefail
          openclaw plugins install @openclaw/deepseek-provider@2026.9.8
          openclaw plugins list | grep -i deepseek
          test -d "$OPENCLAW_STATE_DIR/npm/projects"
      - name: Install matching official DuckDuckGo research plugin
        run: |
          set -euo pipefail
          openclaw plugins install @openclaw/duckduckgo-plugin@2026.9.8
          openclaw plugins list | grep -i duckduckgo
      - name: Validate generated Research OpenClaw config
        env:
          OPENCLAW_CONFIG_PATH: /tmp/openclaw-v2-research.json
          OPENCLAW_CONFIG_READONLY: '1'
        run: |
          set -euo pipefail
          node scripts/write-research-openclaw-config.mjs "$OPENCLAW_CONFIG_PATH"
          test "$(stat -c '%a' "$OPENCLAW_CONFIG_PATH")" = "600"
          test "$(stat -c '%a' "$OPENCLAW_STATE_DIR")" = "700"
          openclaw config validate --json
      - name: Run one live DeepSeek provider smoke when secret exists
        if: steps.prereqs.outputs.deepseek_present == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCLAW_DEEPSEEK_MODEL: deepseek/deepseek-flash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node scripts/live-deepseek-smoke.mjs | tee artifacts/deepseek-live-smoke.json
      - name: Upload safe DeepSeek smoke evidence
        if: steps.prereqs.outputs.deepseek_present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-v2-deepseek-live-smoke
          path: artifacts/deepseek-live-smoke.json
          if-no-files-found: error
          retention-days: 7
