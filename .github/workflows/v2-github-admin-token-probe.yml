name: OpenClaw V2 GitHub Admin Token Probe

on:
  push:
    paths:
      - '.github/workflows/v2-github-admin-token-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENCLAW_GITHUB_TOKEN: ${{ secrets.OPENCLAW_GITHUB_TOKEN }}
    steps:
      - name: Probe token presence and environment public-key access
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/environments/openclaw-v2-live/secrets/public-key"
          if [[ -n "${OPENCLAW_GITHUB_TOKEN:-}" ]]; then
            echo "OPENCLAW_GITHUB_TOKEN=PRESENT"
          else
            echo "OPENCLAW_GITHUB_TOKEN=MISSING"
          fi

          unauth_code="$(curl -sS -o /tmp/unauth.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$endpoint")"
          echo "UNAUTH_PUBLIC_KEY_HTTP=${unauth_code}"

          if [[ -n "${OPENCLAW_GITHUB_TOKEN:-}" ]]; then
            auth_code="$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
              -H "Authorization: Bearer ${OPENCLAW_GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$endpoint")"
            echo "TOKEN_PUBLIC_KEY_HTTP=${auth_code}"
          else
            echo "TOKEN_PUBLIC_KEY_HTTP=SKIPPED"
          fi

# Risks and control:
# - reports presence/status only; token value is never printed;
# - performs GET only and cannot change GitHub secrets;
# - temporary probe must be removed after one result.