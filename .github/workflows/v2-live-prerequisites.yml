name: OpenClaw V2 Live Prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openclaw-v2-live
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Require approved V2 branch
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/v2/openclaw-clean-20261011|refs/heads/v2/openclaw-10-3-cutover) ;;
            *) echo "Live prerequisites blocked on unapproved ref: $GITHUB_REF" >&2; exit 1 ;;
          esac
      - name: Check required V2 live secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "- DATABASE_URL: MISSING" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          else
            echo "- DATABASE_URL: PRESENT" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "- DEEPSEEK_API_KEY: MISSING" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          else
            echo "- DEEPSEEK_API_KEY: PRESENT" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Live prerequisite gate is blocked. No secret values were printed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Live prerequisite gate passed. Secret values were not printed." >> "$GITHUB_STEP_SUMMARY"

# Risks and control:
# - live credentials resolve only from the canonical GitHub Environment;
# - this gate prints only PRESENT/MISSING and never secret values;
# - pre-merge execution is restricted to the exact 2026.10.3 cutover branch;
# - canonical execution remains restricted to the canonical V2 branch.
