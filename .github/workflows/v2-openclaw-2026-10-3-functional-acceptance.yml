name: OpenClaw 2026.10.3 Functional Acceptance

on:
  push:
    branches:
      - 'work/openclaw-2026.10.3-functional-acceptance'
    paths:
      - '.github/workflows/v2-openclaw-2026-10-3-functional-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-2026-10-3-a7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a7_deepseek_live:
    name: A7 DeepSeek exact-model live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact OpenClaw candidate
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if npm install -g openclaw@2026.10.3 --allow-scripts=openclaw; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          test "$installed" = true
          version_output="$(openclaw --version | tail -n 1 | tr -d '\r')"
          printf '%s\n' "$version_output"
          version_token="$(printf '%s\n' "$version_output" | awk '{print $2}')"
          test "$version_token" = "2026.10.3"

      - name: Prepare isolated A7 state and exact DeepSeek plugin
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/openclaw-2026.10.3-a7-state"
          workspace_dir="$RUNNER_TEMP/openclaw-2026.10.3-a7-workspace"
          config_path="$state_dir/openclaw.json"
          install -d -m 700 "$state_dir"
          install -d -m 700 "$workspace_dir"
          export OPENCLAW_STATE_DIR="$state_dir"
          export OPENCLAW_CONFIG_PATH="$config_path"
          {
            echo "OPENCLAW_STATE_DIR=$state_dir"
            echo "OPENCLAW_CONFIG_PATH=$config_path"
            echo "OPENCLAW_A7_WORKSPACE=$workspace_dir"
          } >> "$GITHUB_ENV"
          openclaw setup --baseline --skip-bootstrap --workspace "$workspace_dir" --json > "$RUNNER_TEMP/openclaw-a7-baseline.json"
          openclaw plugins install @openclaw/deepseek-provider@2026.10.3
          openclaw config validate --json > "$RUNNER_TEMP/openclaw-a7-config.json"

      - name: Require DeepSeek credential without exposing it
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          test "${#DEEPSEEK_API_KEY}" -ge 8
          echo "DEEPSEEK_API_KEY_PRESENT=true" >> "$GITHUB_ENV"

      - name: Execute exactly one bounded DeepSeek live call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "${DEEPSEEK_API_KEY_PRESENT:-}" = true
          mkdir -p artifacts

          openclaw infer model run \
            --local \
            --model deepseek/deepseek-flash \
            --thinking off \
            --prompt "Reply with exactly: smoke-ok" \
            --json > "$RUNNER_TEMP/openclaw-a7-deepseek.json"

          DEEPSEEK_JSON="$(cat "$RUNNER_TEMP/openclaw-a7-deepseek.json")" node --input-type=module <<'NODE' > artifacts/openclaw-2026.10.3-a7.json
          const envelope = JSON.parse(process.env.DEEPSEEK_JSON);
          if (envelope?.ok !== true) throw new Error(`DeepSeek envelope failed: ${envelope?.error ?? 'unknown'}`);
          if (envelope?.capability !== 'model.run') throw new Error(`unexpected capability: ${envelope?.capability}`);
          if (envelope?.transport !== 'local') throw new Error(`unexpected transport: ${envelope?.transport}`);
          if (envelope?.provider !== 'deepseek') throw new Error(`unexpected provider: ${envelope?.provider}`);
          if (envelope?.model !== 'deepseek-flash') throw new Error(`unexpected model: ${envelope?.model}`);
          if (!Array.isArray(envelope?.attempts) || envelope.attempts.length !== 0) throw new Error('unexpected fallback attempts');
          const text = envelope?.outputs?.[0]?.text;
          if (typeof text !== 'string' || text.trim() !== 'smoke-ok') throw new Error(`unexpected DeepSeek output: ${JSON.stringify(text)}`);

          const hasNativeUsage = envelope?.usage !== undefined || envelope?.outputs?.some?.((item) => item?.usage !== undefined) === true;
          const hasNativeCost = envelope?.cost !== undefined || envelope?.outputs?.some?.((item) => item?.cost !== undefined) === true;
          const evidence = {
            status: 'PASS',
            stage: 'A7',
            capability: 'deepseek_direct_provider_live',
            openclaw_version: '2026.10.3',
            plugin_version: '2026.10.3',
            provider: envelope.provider,
            model: envelope.model,
            transport: envelope.transport,
            exact_output_verified: true,
            fallback_attempts: envelope.attempts.length,
            provider_calls: 1,
            native_infer_usage_exposed: hasNativeUsage,
            native_infer_cost_exposed: hasNativeCost,
            hosted_database_mutations: 0,
            secret_values_logged: false
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          cat artifacts/openclaw-2026.10.3-a7.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe A7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026-10-3-a7-deepseek-live
          path: artifacts/openclaw-2026.10.3-a7.json
          if-no-files-found: error
          retention-days: 14
