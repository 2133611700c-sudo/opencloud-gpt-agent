name: OpenClaw 2026.10.3 Functional Acceptance

on:
  push:
    branches:
      - 'work/openclaw-2026.10.3-functional-acceptance'
    paths:
      - '.github/workflows/v2-openclaw-2026-10-3-functional-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-2026-10-3-a6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a6_files_runtime_process:
    name: A6 files + exec + process lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact OpenClaw candidate
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if npm install -g openclaw@2026.10.3 --allow-scripts=openclaw; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          test "$installed" = true
          version_output="$(openclaw --version | tail -n 1 | tr -d '\r')"
          printf '%s\n' "$version_output"
          version_token="$(printf '%s\n' "$version_output" | awk '{print $2}')"
          test "$version_token" = "2026.10.3"

      - name: Prepare isolated A6 state and workspace
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/openclaw-2026.10.3-a6-state"
          workspace_dir="$RUNNER_TEMP/openclaw-2026.10.3-a6-workspace"
          config_path="$state_dir/openclaw.json"
          install -d -m 700 "$state_dir"
          install -d -m 700 "$workspace_dir"
          {
            echo "OPENCLAW_STATE_DIR=$state_dir"
            echo "OPENCLAW_CONFIG_PATH=$config_path"
            echo "OPENCLAW_A6_WORKSPACE=$workspace_dir"
            echo "OPENCLAW_EXEC_SHELL_SNAPSHOT=0"
          } >> "$GITHUB_ENV"
          openclaw setup --baseline --skip-bootstrap --workspace "$workspace_dir" --json > "$RUNNER_TEMP/openclaw-a6-baseline.json"
          openclaw config validate --json > "$RUNNER_TEMP/openclaw-a6-config.json"

      - name: Execute real native file and process tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';

          const workspace = process.env.OPENCLAW_A6_WORKSPACE;
          if (!workspace) throw new Error('OPENCLAW_A6_WORKSPACE missing');
          const globalRoot = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
          const packageRoot = path.join(globalRoot, 'openclaw');
          const coreModulePath = path.join(packageRoot, 'dist', 'agents', 'core-coding-tools.js');
          if (!fs.existsSync(coreModulePath)) throw new Error(`missing shipped core tool module: ${coreModulePath}`);
          const { createCoreCodingTools } = await import(pathToFileURL(coreModulePath).href);
          if (typeof createCoreCodingTools !== 'function') throw new Error('createCoreCodingTools export missing');

          const scopeKey = `agent:a6:${process.pid}`;
          const tools = createCoreCodingTools({
            codingRoot: workspace,
            containmentRoot: workspace,
            includeBaseCodingTools: true,
            shellTools: 'full',
            workspaceOnly: true,
            readOnly: false,
            applyPatchEnabled: true,
            applyPatchWorkspaceOnly: true,
            execDefaults: {
              host: 'gateway',
              security: 'full',
              ask: 'off',
              allowBackground: true,
              backgroundMs: 20,
              notifyOnExit: false,
              scopeKey,
            },
            processDefaults: { scopeKey },
          });

          const byName = new Map(tools.map((tool) => [tool.name, tool]));
          const required = ['read', 'write', 'edit', 'apply_patch', 'exec', 'process'];
          for (const name of required) {
            if (!byName.has(name)) throw new Error(`native tool missing from core factory: ${name}`);
          }
          const readTool = byName.get('read');
          const writeTool = byName.get('write');
          const editTool = byName.get('edit');
          const patchTool = byName.get('apply_patch');
          const execTool = byName.get('exec');
          const processTool = byName.get('process');

          const textOf = (result) => Array.isArray(result?.content)
            ? (result.content.find((part) => part?.type === 'text')?.text ?? '')
            : '';

          // 1) Native write -> persisted bytes.
          const filePath = path.join(workspace, 'a6.txt');
          const writeResult = await writeTool.execute('a6-write', {
            path: 'a6.txt',
            content: 'alpha\nbeta\n',
          });
          if (writeResult?.details?.changed !== true) throw new Error('write did not report changed=true');
          if ((await fsp.readFile(filePath, 'utf8')) !== 'alpha\nbeta\n') throw new Error('write persistence mismatch');

          // 2) Native read -> returned exact file data.
          const readResult = await readTool.execute('a6-read', { path: 'a6.txt' });
          const readText = typeof readResult?.details?.content === 'string'
            ? readResult.details.content
            : textOf(readResult);
          if (!readText.includes('alpha') || !readText.includes('beta')) throw new Error('read result missing expected content');

          // 3) Native edit -> targeted replacement and persisted verification.
          const editResult = await editTool.execute('a6-edit', {
            path: 'a6.txt',
            edits: [{ oldText: 'beta', newText: 'gamma' }],
          });
          if (editResult?.details?.changed !== true) throw new Error('edit did not report changed=true');
          if ((await fsp.readFile(filePath, 'utf8')) !== 'alpha\ngamma\n') throw new Error('edit persistence mismatch');

          // 4) Native apply_patch -> second file created inside workspace.
          const patchResult = await patchTool.execute('a6-patch', {
            input: '*** Begin Patch\n*** Add File: patched.txt\n+patched-by-a6\n*** End Patch',
          });
          const patchedPath = path.join(workspace, 'patched.txt');
          if ((await fsp.readFile(patchedPath, 'utf8')).trim() !== 'patched-by-a6') throw new Error('apply_patch persistence mismatch');
          if (!Array.isArray(patchResult?.details?.summary?.added) || !patchResult.details.summary.added.some((entry) => entry.endsWith('patched.txt'))) {
            throw new Error('apply_patch summary missing added file');
          }

          // 5) Workspace containment must fail closed for a path escape.
          const escapePath = path.resolve(workspace, '..', 'a6-escape.txt');
          await fsp.rm(escapePath, { force: true });
          let escapeDenied = false;
          try {
            await writeTool.execute('a6-escape', {
              path: '../a6-escape.txt',
              content: 'must-not-exist\n',
            });
          } catch {
            escapeDenied = true;
          }
          if (!escapeDenied) throw new Error('workspace escape write was not denied');
          if (fs.existsSync(escapePath)) throw new Error('workspace escape file was created');

          // 6) Foreground exec -> exact output and OpenClaw exec marker.
          const foreground = await execTool.execute('a6-exec-fg', {
            command: `printf 'A6_EXEC_OK|%s' "$OPENCLAW_SHELL"`,
            timeoutSeconds: 5,
          });
          if (foreground?.details?.status !== 'completed' || foreground?.details?.exitCode !== 0) {
            throw new Error(`foreground exec failed: ${JSON.stringify(foreground?.details)}`);
          }
          const foregroundText = textOf(foreground);
          if (!foregroundText.includes('A6_EXEC_OK|exec')) throw new Error(`foreground exec marker missing: ${foregroundText}`);

          // 7) Background exec -> process list -> poll terminal -> clear.
          const background = await execTool.execute('a6-exec-bg', {
            command: `printf 'A6_BG_START\\n'; sleep 0.25; printf 'A6_BG_DONE\\n'`,
            background: true,
            timeoutSeconds: 5,
          });
          const sessionId = background?.details?.sessionId;
          if (background?.details?.status !== 'running' || typeof sessionId !== 'string' || !sessionId) {
            throw new Error(`background exec did not return running session: ${JSON.stringify(background?.details)}`);
          }

          const listed = await processTool.execute('a6-process-list', { action: 'list' });
          const sessions = listed?.details?.sessions;
          if (!Array.isArray(sessions) || !sessions.some((entry) => entry?.sessionId === sessionId)) {
            throw new Error('process list did not expose background session');
          }

          let terminal;
          for (let attempt = 0; attempt < 10; attempt += 1) {
            terminal = await processTool.execute(`a6-process-poll-${attempt}`, {
              action: 'poll',
              sessionId,
              timeout: 1000,
            });
            if (terminal?.details?.status !== 'running') break;
          }
          if (terminal?.details?.status !== 'completed' || terminal?.details?.exitCode !== 0) {
            throw new Error(`background process did not complete cleanly: ${JSON.stringify(terminal?.details)}`);
          }
          const aggregated = terminal?.details?.aggregated ?? textOf(terminal);
          if (typeof aggregated !== 'string' || !aggregated.includes('A6_BG_START') || !aggregated.includes('A6_BG_DONE')) {
            throw new Error(`background process output incomplete: ${String(aggregated)}`);
          }

          const cleared = await processTool.execute('a6-process-clear', {
            action: 'clear',
            sessionId,
          });
          if (cleared?.details?.status !== 'completed') throw new Error('process clear did not complete');

          const finalFile = await fsp.readFile(filePath, 'utf8');
          const evidence = {
            status: 'PASS',
            stage: 'A6',
            capability: 'native_files_exec_process',
            openclaw_version: '2026.10.3',
            core_factory_required_tools: required,
            file_tools: {
              write_persisted: true,
              read_verified: true,
              edit_persisted: finalFile === 'alpha\ngamma\n',
              apply_patch_persisted: true,
              workspace_escape_denied: escapeDenied && !fs.existsSync(escapePath),
            },
            runtime_tools: {
              foreground_exec_completed: true,
              openclaw_shell_marker: foregroundText.includes('A6_EXEC_OK|exec'),
              background_exec_session_created: true,
              process_list_saw_session: true,
              process_poll_completed: true,
              process_output_verified: true,
              process_cleared: true,
            },
            provider_calls: 0,
            hosted_database_mutations: 0,
            secret_values_logged: false,
          };
          await fsp.writeFile('artifacts/openclaw-2026.10.3-a6.json', `${JSON.stringify(evidence, null, 2)}\n`, 'utf8');
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          cat artifacts/openclaw-2026.10.3-a6.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe A6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026-10-3-a6-files-runtime
          path: artifacts/openclaw-2026.10.3-a6.json
          if-no-files-found: error
          retention-days: 14
