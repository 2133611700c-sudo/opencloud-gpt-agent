name: OpenClaw 2026.10.3 Functional Acceptance

on:
  push:
    branches:
      - 'work/openclaw-2026.10.3-functional-acceptance'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-2026-10-3-functional-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a2_inventory:
    name: A2 plugins + skills + command inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact OpenClaw candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install -g openclaw@2026.10.3 --allow-scripts=openclaw
          version_output="$(openclaw --version | tail -n 1 | tr -d '\r')"
          printf '%s\n' "$version_output"
          version_token="$(printf '%s\n' "$version_output" | awk '{print $2}')"
          test "$version_token" = "2026.10.3"

      - name: Prepare isolated A2 state
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/openclaw-2026.10.3-a2-state"
          workspace_dir="$RUNNER_TEMP/openclaw-2026.10.3-a2-workspace"
          config_path="$state_dir/openclaw.json"
          install -d -m 700 "$state_dir"
          install -d -m 700 "$workspace_dir"
          {
            echo "OPENCLAW_STATE_DIR=$state_dir"
            echo "OPENCLAW_CONFIG_PATH=$config_path"
            echo "OPENCLAW_A2_WORKSPACE=$workspace_dir"
          } >> "$GITHUB_ENV"
          openclaw setup --baseline --skip-bootstrap --workspace "$workspace_dir" --json > "$RUNNER_TEMP/openclaw-a2-baseline.json"

      - name: Install exact matching official plugins
        shell: bash
        run: |
          set -euo pipefail
          openclaw plugins install @openclaw/deepseek-provider@2026.10.3
          openclaw plugins install @openclaw/duckduckgo-plugin@2026.10.3
          test -d "$OPENCLAW_STATE_DIR/npm/projects"

      - name: Prove plugin inventory
        shell: bash
        run: |
          set -euo pipefail
          openclaw plugins list --json > "$RUNNER_TEMP/openclaw-a2-plugins.json"
          PLUGINS_JSON="$(cat "$RUNNER_TEMP/openclaw-a2-plugins.json")" node --input-type=module -e '
            const value = JSON.parse(process.env.PLUGINS_JSON);
            const serialized = JSON.stringify(value).toLowerCase();
            for (const expected of ["browser", "deepseek", "duckduckgo"]) {
              if (!serialized.includes(expected)) throw new Error(`expected plugin inventory entry missing: ${expected}`);
            }
          '

      - name: Prove skills inventory and readiness report
        shell: bash
        run: |
          set -euo pipefail
          openclaw skills list --json > "$RUNNER_TEMP/openclaw-a2-skills.json"
          openclaw skills check --json > "$RUNNER_TEMP/openclaw-a2-skills-check.json"
          SKILLS_JSON="$(cat "$RUNNER_TEMP/openclaw-a2-skills.json")" SKILLS_CHECK_JSON="$(cat "$RUNNER_TEMP/openclaw-a2-skills-check.json")" node --input-type=module -e '
            const list = JSON.parse(process.env.SKILLS_JSON);
            const check = JSON.parse(process.env.SKILLS_CHECK_JSON);
            if (!Array.isArray(list.skills)) throw new Error("skills list missing skills array");
            if (list.skills.length === 0) throw new Error("skills inventory unexpectedly empty");
            if (!check || typeof check !== "object") throw new Error("skills check did not return an object");
            if (check.ok === false) throw new Error("skills check returned ok=false");
          '

      - name: Prove major command families are callable
        shell: bash
        run: |
          set -euo pipefail
          root_help="$RUNNER_TEMP/openclaw-a2-root-help.txt"
          openclaw --help > "$root_help"
          for cmd in setup config doctor agent agents gateway models nodes browser cron hooks channels memory security sandbox skills plugins; do
            grep -E "(^|[[:space:]])${cmd}([[:space:]]|$)" "$root_help" >/dev/null || {
              echo "missing command family in root help: $cmd" >&2
              exit 1
            }
          done

      - name: Record safe A2 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          PLUGINS_JSON="$(cat "$RUNNER_TEMP/openclaw-a2-plugins.json")" SKILLS_JSON="$(cat "$RUNNER_TEMP/openclaw-a2-skills.json")" node --input-type=module <<'NODE' > artifacts/openclaw-2026.10.3-a2.json
          const plugins = JSON.parse(process.env.PLUGINS_JSON);
          const skills = JSON.parse(process.env.SKILLS_JSON);
          const pluginRows = Array.isArray(plugins) ? plugins : Array.isArray(plugins.plugins) ? plugins.plugins : [];
          const evidence = {
            status: 'PASS',
            stage: 'A2',
            capability: 'plugin_skill_command_inventory',
            openclaw_version: '2026.10.3',
            plugin_inventory_json: 'PASS',
            expected_plugins_seen: ['browser', 'deepseek', 'duckduckgo'],
            observed_plugin_rows: pluginRows.length,
            skills_list_json: 'PASS',
            skills_check_json: 'PASS',
            observed_skills: skills.skills.length,
            command_families: ['setup','config','doctor','agent','agents','gateway','models','nodes','browser','cron','hooks','channels','memory','security','sandbox','skills','plugins'],
            provider_calls: 0,
            hosted_database_mutations: 0,
            secret_values_logged: false,
          };
          process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          NODE
          cat artifacts/openclaw-2026.10.3-a2.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload safe A2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-2026-10-3-a2-inventory
          path: artifacts/openclaw-2026.10.3-a2.json
          if-no-files-found: error
          retention-days: 14
