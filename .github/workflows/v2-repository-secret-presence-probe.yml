name: OpenClaw V2 Repository Secret Presence Probe

on:
  push:
    paths:
      - '.github/workflows/v2-repository-secret-presence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Report repository secret presence only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DATABASE_URL:-}" ]]; then echo "DATABASE_URL=PRESENT"; else echo "DATABASE_URL=MISSING"; fi
          if [[ -n "${DEEPSEEK_API_KEY:-}" ]]; then echo "DEEPSEEK_API_KEY=PRESENT"; else echo "DEEPSEEK_API_KEY=MISSING"; fi

# Risks and control:
# - no GitHub environment is attached, so this isolates repository-level secret resolution;
# - only PRESENT/MISSING is emitted; values are never printed;
# - this workflow is temporary and must be removed after the single probe.
